; Vale checks the prose rules in docs/authoring/WRITING.md that a machine can
; decide, in `docs/` and in the comments of `.ts` and `.tsx` sources. The rules
; it cannot decide — one name per thing, one meaning per word, one topic per
; paragraph — stay with the reader.
;
; The Rome style is vendored under .vale/styles/Rome. There is no `Packages`
; key and no `vale sync`, so a check needs no network and the word lists version
; alongside WRITING.md.
;
; `pnpm lint:prose` decides which files are read, passing one glob per format.
; This file decides which rules apply to each.

StylesPath = .vale/styles
MinAlertLevel = warning

; Parse comment bodies as Markdown so a backticked identifier reads as code
; rather than prose. Without this, ``the `utilization` field`` reports a
; word-choice error against a name the comment is only citing.
[formats]
ts = md
tsx = md

[*.md]
BasedOnStyles = Rome

[*.{ts,tsx}]
BasedOnStyles = Rome
; Three rules govern docs prose and not comments.
;
; History: docs/authoring/comments.md admits present-tense "no longer" and "used
; to" outright, and gives "// After unref, the timer no longer keeps the process
; alive." as prose to prefer.
;
; Semicolons and Contractions: WRITING.md scopes both to `docs/`. Comments here
; use them consistently, which is a house style rather than a debt.
Rome.History = NO
Rome.Semicolons = NO
Rome.Contractions = NO
