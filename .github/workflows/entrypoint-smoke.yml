name: Entrypoint Smoke

# Boots the PR's docker-entrypoint.sh in the latest main test image and checks
# the container lifecycle: every service listens, `docker stop` is graceful, a
# restart skips the /app sync, and a daemon crash exits non-zero. Checks live in
# scripts/docker/entrypoint-smoke.mts.
#
# The job layers the PR's entrypoint onto zoolsher/rome:main instead of building
# the 8 GB image, whose amd64 build has run the runner out of disk
# (scripts/docker/probe-build-disk.sh). Dockerfile changes are
# covered after the fact: docker-publish-test.yml runs the same checks against
# every full image it publishes.

on:
  pull_request:
    branches: [main]
    paths:
      - docker-entrypoint.sh
      - scripts/docker/entrypoint-smoke.mts
      - .github/workflows/entrypoint-smoke.yml
  workflow_dispatch:

concurrency:
  group: entrypoint-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Layer the entrypoint onto the main test image
        run: |
          docker build --pull -t rome-entrypoint-smoke -f - . <<'EOF'
          FROM zoolsher/rome:main
          COPY --chmod=0755 docker-entrypoint.sh /usr/local/bin/docker-entrypoint.sh
          EOF

      - name: Run entrypoint smoke checks
        run: node scripts/docker/entrypoint-smoke.mts rome-entrypoint-smoke
