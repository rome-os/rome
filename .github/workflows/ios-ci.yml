name: iOS CI

# Builds the native app in ios/ and runs its unit tests on a simulator. The app
# is an Xcode project outside the pnpm workspace, so the main CI never sees it;
# this job runs only when ios/ or this file changes.

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      # Pinned so a runner image update never changes the compiler under a
      # green branch. Raise it on purpose, with a green run on the new one.
      - name: Select Xcode 26.6
        run: |
          xcode=$(ls -d /Applications/Xcode_26.6*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild test \
            -project Rome.xcodeproj \
            -scheme Rome \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  # Debug builds can play a recording as the microphone for UI tests. Release
  # must hold no trace of it: no recording source and no launch argument.
  release-has-no-test-audio:
    name: Release has no test audio
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          xcode=$(ls -d /Applications/Xcode_26.6*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Build Release
        run: |
          xcodebuild build \
            -project Rome.xcodeproj \
            -scheme Rome \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/rome-release \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Look for the test audio source
        run: |
          binary=$(find /tmp/rome-release/Build/Products -path '*Rome.app/Rome' -type f | head -1)
          test -n "$binary"
          for needle in RecordingAudioSource RomeVoiceInputRecording RomeVoiceInputMicrophone; do
            if strings -a "$binary" | grep -q "$needle" || nm -a "$binary" 2>/dev/null | grep -q "$needle"; then
              echo "::error::Release binary mentions $needle"
              exit 1
            fi
          done
          echo "Release binary holds no test audio source."

  # UI tests launch the Debug app on a simulator and drive it. They run here,
  # apart from the unit tests, so Build + Test keeps its time.
  ui-tests:
    name: UI tests
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          xcode=$(ls -d /Applications/Xcode_26.6*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The voice input tests run against a stand-in instance that the
      # voice-input environment keeps on its own branch. Without it, only the
      # launch test runs.
      - name: Fetch the stand-in instance
        id: standin
        run: |
          # The job runs in ios/, but the stand-in's path is from the repository root.
          set -o pipefail
          if git fetch --quiet --depth=1 origin voice-input 2>/dev/null &&
             git cat-file -e FETCH_HEAD:environments/voice-input/ios-stand-in/server.mjs 2>/dev/null; then
            mkdir -p /tmp/stand-in
            git -C "$GITHUB_WORKSPACE" archive FETCH_HEAD environments/voice-input/ios-stand-in | tar -x -C /tmp/stand-in
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No stand-in instance on the voice-input branch, so only LaunchTests run; the voice input UI tests are skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start the stand-in instance
        if: steps.standin.outputs.present == 'true'
        run: |
          node /tmp/stand-in/environments/voice-input/ios-stand-in/server.mjs --port 4790 --log /tmp/stand-in.log &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4790/__stand-in/health && exit 0; sleep 1; done
          echo "::error::The stand-in instance did not answer on port 4790."
          exit 1
      - name: Run the UI tests
        env:
          STANDIN: ${{ steps.standin.outputs.present }}
        run: |
          # xcodebuild hands TEST_RUNNER_* environment variables to the tests
          # without the prefix; the tests pass them to the app.
          extra=()
          if [ "$STANDIN" = "true" ]; then
            export TEST_RUNNER_ROME_LOCAL_ORIGIN=http://127.0.0.1:4790
            export TEST_RUNNER_ROME_LOCAL_USER=guardian
            export TEST_RUNNER_ROME_LOCAL_PASSWORD=stand-in
          else
            extra=(-only-testing:RomeUITests/LaunchTests)
          fi
          xcodebuild test \
            -project Rome.xcodeproj \
            -scheme RomeUITests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/ui-tests.xcresult" \
            "${extra[@]}"
      # Rule 1: the field shows listening within 0.5 s of the start action. The app marks each
      # start with a StartListening signpost interval, and the voice input tests measure it;
      # XCTest has no way to assert on a measurement, so this step reads the result bundle.
      - name: "Rules 1 and 9: every start shows listening within 0.5 s, every stop closes the microphone within 1 s"
        if: always() && steps.standin.outputs.present == 'true'
        run: |
          xcrun xcresulttool get test-results metrics --path "$RUNNER_TEMP/ui-tests.xcresult" > "$RUNNER_TEMP/metrics.json"
          python3 - "$RUNNER_TEMP/metrics.json" <<'PY'
          import json, sys

          # The app's signpost intervals, and the bar each rule holds every one to.
          BARS = {
              "StartListening": (0.5, "rule 1", "a start took {v:.3f} s to show listening"),
              "StopListening": (1.0, "rule 9", "a stop took {v:.3f} s to close the microphone"),
          }
          found = {interval: [] for interval in BARS}

          def walk(node, test=None):
              if isinstance(node, dict):
                  test = node.get("testIdentifier") or test
                  name = str(node.get("displayName") or node.get("identifier") or "")
                  for interval in BARS:
                      if interval in name and isinstance(node.get("measurements"), list):
                          found[interval].append((test, name, node.get("unitOfMeasurement", ""), node["measurements"]))
                  for value in node.values():
                      walk(value, test)
              elif isinstance(node, list):
                  for value in node:
                      walk(value, test)

          walk(json.load(open(sys.argv[1])))
          failed = False
          for interval, (bar, rule, says) in BARS.items():
              if not found[interval]:
                  print(f"::error::No {interval} measurement in the result bundle, so {rule}'s {bar} s was not checked.")
                  failed = True
                  continue
              over = []
              blank = False
              for test, name, unit, values in found[interval]:
                  seconds = [v / 1000 if unit == "ms" else v for v in values]
                  print(f"{test}: {name}: " + ", ".join(f"{v:.3f} s" for v in seconds))
                  over += [(test, v) for v in seconds if v > bar]
                  # A measured window with no interval in it reads 0; that is no evidence, not a pass.
                  empty = [v for v in seconds if v == 0]
                  if empty:
                      print(f"::error::{test}: {len(empty)} of {len(seconds)} measurements held no {interval} interval, so {rule} was not checked there.")
                      blank = True
              for test, v in over:
                  print(f"::error::{test}: " + says.format(v=v) + f"; the bar is {bar} s")
              failed = failed or bool(over) or blank
              if not over and not blank:
                  print(f"Every {interval} interval was within {bar} s ({rule}).")
          if not all(found.values()):
              print(open(sys.argv[1]).read()[:4000])
          if failed:
              sys.exit(1)
          PY
      - name: Keep the stand-in's log
        if: always() && steps.standin.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stand-in-log
          path: /tmp/stand-in.log
          if-no-files-found: ignore
