name: iOS CI

# Builds the native app in ios/ and runs its unit tests on a simulator. The app
# is an Xcode project outside the pnpm workspace, so the main CI never sees it;
# this job runs only when ios/ or this file changes.

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  # Nightly, every voice input UI test, including the ones too long for each PR.
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The nightly run shares main's ref, so a merge must not cancel it, nor it a merge's run.
  group: ios-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      # Pinned so a runner image update never changes the compiler under a
      # green branch. Raise it on purpose, with a green run on the new one.
      - name: Select Xcode 26.6
        run: |
          xcode=$(ls -d /Applications/Xcode_26.6*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      # The Swift packages (A2UI and its plugin and macros) are fetched once per
      # Package.resolved, not on every run.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('ios/Rome.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild test \
            -project Rome.xcodeproj \
            -scheme Rome \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

  # Debug builds can play a recording as the microphone for UI tests. Release
  # must hold no trace of it: no recording source and no launch argument.
  release-has-no-test-audio:
    name: Release has no test audio
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          xcode=$(ls -d /Applications/Xcode_26.6*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      # The Swift packages (A2UI and its plugin and macros) are fetched once per
      # Package.resolved, not on every run.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('ios/Rome.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Build Release
        run: |
          xcodebuild build \
            -project Rome.xcodeproj \
            -scheme Rome \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/rome-release \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Look for the test audio source
        run: |
          binary=$(find /tmp/rome-release/Build/Products -path '*Rome.app/Rome' -type f | head -1)
          test -n "$binary"
          for needle in RecordingAudioSource RomeVoiceInputRecording RomeVoiceInputMicrophone; do
            if strings -a "$binary" | grep -q "$needle" || nm -a "$binary" 2>/dev/null | grep -q "$needle"; then
              echo "::error::Release binary mentions $needle"
              exit 1
            fi
          done
          echo "Release binary holds no test audio source."

  # UI tests launch the Debug app on a simulator and drive it. They run here,
  # apart from the unit tests, so Build + Test keeps its time.
  ui-tests:
    name: UI tests
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # The voice input suite is off while a run of it takes about 35 minutes; ZHA-241
      # speeds it up. "on" brings it back, with its stand-in instance and rule 1 and 9 checks.
      VOICE_INPUT_UI_TESTS: "off"
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          xcode=$(ls -d /Applications/Xcode_26.6*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      # The Swift packages (A2UI and its plugin and macros) are fetched once per
      # Package.resolved, not on every run.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('ios/Rome.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)
          udid=$(xcrun simctl list devices available | grep -E "^ +$name \(" | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          test -n "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Rome.xcodeproj \
            -scheme RomeUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/ui-dd" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO
      # The app timed out launching on a simulator still booting, so the tests
      # start only once it has booted. Booting during the build slowed the
      # build by about four minutes, so it boots after.
      - name: Boot the simulator
        # A hung boot fails here, readably, not at the job's limit.
        timeout-minutes: 10
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      # The voice input suite takes about 20 minutes, so a PR or push runs it only when it
      # changes voice input; nightly runs it whole, with rules 4, 5 and 14, whose three
      # minutes of dictation, 60 s wait and 90 s of silence are too long for every change.
      - name: Decide which UI tests run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo "voice=true" >> "$GITHUB_OUTPUT"
            echo "long=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "long=false" >> "$GITHUB_OUTPUT"
          # The voice control lives in the message field, so the field's files count too, as
          # does Settings' microphone row. The message bubbles sit apart from the field, so a
          # change to them alone leaves the voice input suite to the nightly run.
          voice='^(ios/Rome/Features/VoiceInput/|ios/Rome(UI)?Tests/VoiceInput|ios/RomeUITests/speech\.wav$|ios/Rome/Features/Chat/Composer(TextView)?\.swift$|ios/Rome/Features/Settings/MicrophoneRow\.swift$|\.github/workflows/ios-ci\.yml$)'
          if git fetch --quiet --no-tags --depth=1 origin "$BASE" 2>/dev/null &&
             git diff --name-only "$BASE" HEAD | grep -qE "$voice"; then
            echo "voice=true" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$BASE" 2>/dev/null; then
            echo "::notice::No voice input change, so only LaunchTests run; the voice input suite runs nightly."
            echo "voice=false" >> "$GITHUB_OUTPUT"
          else
            # No base to compare with, such as a branch's first push: run it.
            echo "voice=true" >> "$GITHUB_OUTPUT"
          fi
      # The voice input tests run against a stand-in instance that the
      # voice-input environment keeps on its own branch. Without it, only the
      # launch test runs.
      - name: Fetch the stand-in instance
        id: standin
        if: steps.scope.outputs.voice == 'true' && env.VOICE_INPUT_UI_TESTS == 'on'
        run: |
          # The job runs in ios/, but the stand-in's path is from the repository root.
          set -o pipefail
          if git fetch --quiet --depth=1 origin voice-input 2>/dev/null &&
             git cat-file -e FETCH_HEAD:environments/voice-input/ios-stand-in/server.mjs 2>/dev/null; then
            mkdir -p /tmp/stand-in
            git -C "$GITHUB_WORKSPACE" archive FETCH_HEAD environments/voice-input/ios-stand-in | tar -x -C /tmp/stand-in
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No stand-in instance on the voice-input branch, so only LaunchTests run; the voice input UI tests are skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start the stand-in instance
        if: steps.standin.outputs.present == 'true'
        run: |
          node /tmp/stand-in/environments/voice-input/ios-stand-in/server.mjs --port 4790 --log /tmp/stand-in.log &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4790/__stand-in/health && exit 0; sleep 1; done
          echo "::error::The stand-in instance did not answer on port 4790."
          exit 1
      - name: Run the UI tests
        env:
          STANDIN: ${{ steps.standin.outputs.present }}
          SCOPE: ${{ steps.scope.outputs.voice }}
          LONG: ${{ steps.scope.outputs.long }}
        run: |
          # xcodebuild hands TEST_RUNNER_* environment variables to the tests
          # without the prefix; the tests pass them to the app.
          extra=()
          if [ "$STANDIN" = "true" ]; then
            export TEST_RUNNER_ROME_LOCAL_ORIGIN=http://127.0.0.1:4790
            export TEST_RUNNER_ROME_LOCAL_USER=guardian
            export TEST_RUNNER_ROME_LOCAL_PASSWORD=stand-in
            if [ "$LONG" != "true" ]; then
              extra=(-skip-testing:RomeUITests/VoiceInputTests/testRule4ThreeMinutesStayInTheField
                     -skip-testing:RomeUITests/VoiceInputTests/testRule5OnlyTheGuardianSends
                     -skip-testing:RomeUITests/VoiceInputTests/testRule14TheWaveformIsFlatInSilence)
            fi
          elif [ "$SCOPE" = "true" ] && [ "$VOICE_INPUT_UI_TESTS" != "on" ]; then
            # The voice input suite is off, so the rest of the UI suite runs without it.
            extra=(-skip-testing:RomeUITests/VoiceInputTests)
          else
            # The launch test alone gets a second try, so a simulator hiccup does
            # not fail the job. The voice input suite gets none: its rules exist to
            # catch a start that misses now and then.
            extra=(-only-testing:RomeUITests/LaunchTests -retry-tests-on-failure -test-iterations 2)
          fi
          xcodebuild test-without-building \
            -project Rome.xcodeproj \
            -scheme RomeUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/ui-dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -resultBundlePath "$RUNNER_TEMP/ui-tests.xcresult" \
            "${extra[@]}"
      # Rule 1: the field shows listening within 0.5 s of the start action. The app marks each
      # start with a StartListening signpost interval, and the voice input tests measure it;
      # XCTest has no way to assert on a measurement, so this step reads the result bundle.
      - name: "Rule 1: every start shows listening within 0.5 s"
        if: always() && steps.standin.outputs.present == 'true'
        run: |
          xcrun xcresulttool get test-results metrics --path "$RUNNER_TEMP/ui-tests.xcresult" > "$RUNNER_TEMP/metrics.json"
          python3 - "$RUNNER_TEMP/metrics.json" <<'PY'
          import json, sys

          # The app's signpost intervals, and the bar each rule holds every one to.
          BARS = {
              "StartListening": (0.5, "rule 1", "a start took {v:.3f} s to show listening"),
          }
          found = {interval: [] for interval in BARS}

          def walk(node, test=None):
              if isinstance(node, dict):
                  test = node.get("testIdentifier") or test
                  name = str(node.get("displayName") or node.get("identifier") or "")
                  for interval in BARS:
                      if interval in name and isinstance(node.get("measurements"), list):
                          found[interval].append((test, name, node.get("unitOfMeasurement", ""), node["measurements"]))
                  for value in node.values():
                      walk(value, test)
              elif isinstance(node, list):
                  for value in node:
                      walk(value, test)

          walk(json.load(open(sys.argv[1])))
          failed = False
          for interval, (bar, rule, says) in BARS.items():
              if not found[interval]:
                  print(f"::error::No {interval} measurement in the result bundle, so {rule}'s {bar} s was not checked.")
                  failed = True
                  continue
              over = []
              blank = False
              for test, name, unit, values in found[interval]:
                  seconds = [v / 1000 if unit == "ms" else v for v in values]
                  print(f"{test}: {name}: " + ", ".join(f"{v:.3f} s" for v in seconds))
                  over += [(test, v) for v in seconds if v > bar]
                  # A measured window with no interval in it reads 0; that is no evidence, not a pass.
                  empty = [v for v in seconds if v == 0]
                  if empty:
                      print(f"::error::{test}: {len(empty)} of {len(seconds)} measurements held no {interval} interval, so {rule} was not checked there.")
                      blank = True
              for test, v in over:
                  print(f"::error::{test}: " + says.format(v=v) + f"; the bar is {bar} s")
              failed = failed or bool(over) or blank
              if not over and not blank:
                  print(f"Every {interval} interval was within {bar} s ({rule}).")
          if not all(found.values()):
              print(open(sys.argv[1]).read()[:4000])
          if failed:
              sys.exit(1)
          PY
      - name: "Rule 9: every kind of stop has a StopListening interval"
        if: always() && steps.standin.outputs.present == 'true'
        run: |
          # On the simulator the recording stands in for the microphone and closes in
          # microseconds, so leg B scores rule 9 by count: each measured stop of the rule 9 test
          # (leaving the chat, the background, a transcriber error, losing the network, the
          # guardian's) must hold a StopListening interval, which reads above 0 s. A window with
          # none reads exactly 0. The second is scored by hand on a phone (leg C).
          python3 - "$RUNNER_TEMP/metrics.json" <<'PY'
          import json, sys

          # Without the stand-in's drop control the test makes the guardian's stop in place of losing the network.
          STOPS = ["leaving the chat", "the background", "a transcriber error", "losing the network (or the guardian's stop)", "the guardian's stop"]
          found = []

          def walk(node, test=None):
              if isinstance(node, dict):
                  test = node.get("testIdentifier") or test
                  name = str(node.get("displayName") or node.get("identifier") or "")
                  if "StopListening" in name and isinstance(node.get("measurements"), list):
                      found.append((test, node["measurements"]))
                  for value in node.values():
                      walk(value, test)
              elif isinstance(node, list):
                  for value in node:
                      walk(value, test)

          walk(json.load(open(sys.argv[1])))
          if not found:
              sys.exit("::error::No StopListening measurement in the result bundle, so rule 9 was not checked.")
          failed = False
          for test, values in found:
              print(f"{test}: " + ", ".join(f"{stop} {v:.6f} s" for stop, v in zip(STOPS, values)))
              if len(values) != len(STOPS):
                  print(f"::error::{test}: {len(values)} measured stops; the rule 9 test makes {len(STOPS)}.")
                  failed = True
              for stop, v in zip(STOPS, values):
                  if v <= 0:
                      print(f"::error::{test}: no StopListening interval for {stop}.")
                      failed = True
          if failed:
              sys.exit(1)
          print("Rule 9 (leg B): interval present for every kind of stop; duration not meaningful with the recording stand-in.")
          PY
      - name: Keep the stand-in's log
        if: always() && steps.standin.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stand-in-log
          path: /tmp/stand-in.log
          if-no-files-found: ignore
