name: iOS CI

# Builds the native app in ios/ and runs its unit tests on a simulator. The app
# is an Xcode project outside the pnpm workspace, so the main CI never sees it;
# this job runs only when ios/ or this file changes.

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      # Pinned so a runner image update never changes the compiler under a
      # green branch. Raise it on purpose, with a green run on the new one.
      - name: Select Xcode 26.6
        run: |
          xcode=$(ls -d /Applications/Xcode_26.6*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild test \
            -project Rome.xcodeproj \
            -scheme Rome \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      # Temporary, for #2168: print the stack of a test-host crash, which the
      # log does not show.
      - name: Crash reports
        if: failure()
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Rome*.ips 2>/dev/null | head -3); do
            echo "== $f"
            python3 -c '
          import json, sys
          text = open(sys.argv[1]).read().split("\n", 1)
          body = json.loads(text[1])
          print(body.get("exception"))
          images = body["usedImages"]
          for i, thread in enumerate(body["threads"]):
              if not thread.get("triggered"): continue
              for frame in thread["frames"][:40]:
                  print(images[frame["imageIndex"]].get("name", "?"), frame.get("symbol", "?"), frame.get("sourceFile", ""), frame.get("sourceLine", ""))
          ' "$f"
          done
