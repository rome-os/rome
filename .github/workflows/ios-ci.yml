name: iOS CI

# Builds the native app in ios/ and runs its unit tests on a simulator. The app
# is an Xcode project outside the pnpm workspace, so the main CI never sees it;
# this job runs only when ios/ or this file changes.

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      # Pinned so a runner image update never changes the compiler under a
      # green branch. Raise it on purpose, with a green run on the new one.
      - name: Select Xcode 26.6
        run: |
          xcode=$(ls -d /Applications/Xcode_26.6*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild test \
            -project Rome.xcodeproj \
            -scheme Rome \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  # Debug builds can play a recording as the microphone for UI tests. Release
  # must hold no trace of it: no recording source and no launch argument.
  release-has-no-test-audio:
    name: Release has no test audio
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          xcode=$(ls -d /Applications/Xcode_26.6*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Build Release
        run: |
          xcodebuild build \
            -project Rome.xcodeproj \
            -scheme Rome \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/rome-release \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Look for the test audio source
        run: |
          binary=$(find /tmp/rome-release/Build/Products -path '*Rome.app/Rome' -type f | head -1)
          test -n "$binary"
          for needle in RecordingAudioSource RomeVoiceInputRecording RomeVoiceInputMicrophone; do
            if strings -a "$binary" | grep -q "$needle" || nm -a "$binary" 2>/dev/null | grep -q "$needle"; then
              echo "::error::Release binary mentions $needle"
              exit 1
            fi
          done
          echo "Release binary holds no test audio source."

  # UI tests launch the Debug app on a simulator and drive it. They run here,
  # apart from the unit tests, so Build + Test keeps its time.
  ui-tests:
    name: UI tests
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          xcode=$(ls -d /Applications/Xcode_26.6*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Pick a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The voice input tests run against a stand-in instance that the
      # voice-input environment keeps on its own branch. Without it, only the
      # launch test runs.
      - name: Fetch the stand-in instance
        id: standin
        run: |
          if git fetch --quiet --depth=1 origin voice-input 2>/dev/null &&
             git cat-file -e FETCH_HEAD:environments/voice-input/ios-stand-in/server.mjs 2>/dev/null; then
            mkdir -p /tmp/stand-in
            git archive FETCH_HEAD environments/voice-input/ios-stand-in | tar -x -C /tmp/stand-in
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No stand-in instance on the voice-input branch, so only LaunchTests run; the voice input UI tests are skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start the stand-in instance
        if: steps.standin.outputs.present == 'true'
        run: |
          node /tmp/stand-in/environments/voice-input/ios-stand-in/server.mjs --port 4790 --log /tmp/stand-in.log &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4790/__stand-in/health && break; sleep 1; done
      - name: Run the UI tests
        env:
          STANDIN: ${{ steps.standin.outputs.present }}
        run: |
          # xcodebuild hands TEST_RUNNER_* environment variables to the tests
          # without the prefix; the tests pass them to the app.
          extra=()
          if [ "$STANDIN" = "true" ]; then
            export TEST_RUNNER_ROME_LOCAL_ORIGIN=http://127.0.0.1:4790
            export TEST_RUNNER_ROME_LOCAL_USER=guardian
            export TEST_RUNNER_ROME_LOCAL_PASSWORD=stand-in
          else
            extra=(-only-testing:RomeUITests/LaunchTests)
          fi
          xcodebuild test \
            -project Rome.xcodeproj \
            -scheme RomeUITests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            "${extra[@]}"
      - name: Keep the stand-in's log
        if: always() && steps.standin.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stand-in-log
          path: /tmp/stand-in.log
          if-no-files-found: ignore
