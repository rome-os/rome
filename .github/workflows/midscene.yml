name: E2E Testing by Midscene

# Visual E2E in two suites, each one job and one report artifact:
# - mock: the strict MSW mock build (pnpm --filter rome-web dev:mock:e2e, port
#   3200) with synthetic in-repo fixtures and no real backend.
# - backend: a real Rome container from the published image, with a real model
#   configured from ROME_E2E_ANTHROPIC_ENV_JSON.
# Both reports go through the same merge, Summary, and Pages publication.
# Model credentials come from repository secrets.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC / 14:00 Beijing daily
  workflow_dispatch:
    inputs:
      report_source_run_id:
        description: Rebuild the Summary from an existing run's suite artifacts without model calls
        required: false
        type: string
      publish_pages:
        description: Publish reports to Pages when this repository is enabled
        required: false
        type: boolean
        default: true
      suite:
        description: Which suites to run, or to rebuild with report_source_run_id
        required: false
        type: choice
        options: [all, mock, backend]
        default: all

# Credential trust model:
# The four MIDSCENE_MODEL_* secrets are billable, and a pull_request job runs
# contributor-controlled code with the secrets in its environment. Naming a
# protected environment in the workflow does not create its reviewer gate — an
# absent environment is provisioned open — so until a maintainer actually
# configures a protected environment with required reviewers, the secret-
# bearing path (the `mock` and `backend` jobs) is restricted to the protected main
# branch in the upstream repository. Fork owners may explicitly dispatch a
# fork branch with their fork's own secrets. Pull requests do not trigger
# this workflow; the gates below still keep pull_request runs out of the
# secret-bearing and publishing jobs. Reports are always aggregated after
# model runs. Pages publication is enabled upstream and opt-in for forks.

permissions:
  contents: read

concurrency:
  group: midscene-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  MIDSCENE_UPSTREAM_REPOSITORY: rome-os/rome

jobs:
  harness-validation:
    name: Midscene harness validation (no secrets)
    outputs:
      upstream-repository: ${{ env.MIDSCENE_UPSTREAM_REPOSITORY }}
      projects: ${{ steps.plan.outputs.projects }}
    # Runs nightly and on manual dispatch, before the suites: validates the
    # package without model secrets, a browser download, the Rome workspace
    # install, or the mock server. Loading the config and collecting YAML
    # cases never calls chromium.launch or the model.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/midscene/package-lock.json

      - name: Install Midscene test dependencies
        # This job never launches a browser; skip the playwright postinstall
        # download. Importing the playwright package (for its types/API) does
        # not require the browser binaries.
        working-directory: tests/midscene
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --strict-allow-scripts

      - name: Type-check custom nodes
        working-directory: tests/midscene
        run: npm run typecheck

      - name: Collect workflow cases
        # Parses every cases/**/*.yaml and resolves node references exactly
        # like the runner; fails on schema errors or unknown nodes.
        working-directory: tests/midscene
        run: npm run collect

      - name: Test CI Summary renderer
        working-directory: tests/midscene
        run: npm run test:summary

      # The report jobs expect exactly the Midscene projects this run selects,
      # so a single-suite run still produces a complete report.
      - name: Plan the selected suites
        id: plan
        env:
          SUITE: ${{ inputs.suite || 'all' }}
        run: |
          case "$SUITE" in
            mock) projects=web-mock ;;
            backend) projects=web-backend ;;
            *) projects=web-mock,web-backend ;;
          esac
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  # The two model-backed suites. Both jobs follow the same step order and each
  # uploads one `midscene-suite-<suite>` artifact for the shared report jobs
  # below; only the target each suite tests differs.
  mock:
    needs: harness-validation
    name: "Midscene suite: mock"
    # Fail-closed trust gate: contributor-controlled pull request code never
    # runs automatically with billable model credentials. Upstream runs only
    # on main; a fork owner may explicitly dispatch a fork ref with that fork's
    # own secrets.
    if: >-
      inputs.report_source_run_id == '' && inputs.suite != 'backend' &&
      needs.harness-validation.outputs.upstream-repository != '' &&
      (github.repository == needs.harness-validation.outputs.upstream-repository && github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.repository != needs.harness-validation.outputs.upstream-repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HEADLESS: "true"
      ROME_E2E_BASE_URL: http://localhost:3200
      # The model endpoint is reachable over IPv4; avoid family-race timeouts.
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # pnpm must exist before setup-node resolves the pnpm store for its
      # cache; without a version it reads the root `packageManager` field.
      - name: Enable pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Activate Node.js 24 and pnpm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Require Midscene model configuration
        env: &model-env
          # Scoped to the steps that actually call the model; install and the
          # mock server never see these variables.
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
        run: |
          test -n "$MIDSCENE_MODEL_API_KEY"
          test -n "$MIDSCENE_MODEL_NAME"
          test -n "$MIDSCENE_MODEL_BASE_URL"
          test -n "$MIDSCENE_MODEL_FAMILY"

      - name: Install Midscene test dependencies
        # allowScripts for esbuild/sharp is declared in this package.json, so
        # npm ci runs their (approved) install scripts non-interactively.
        working-directory: tests/midscene
        run: |
          npm ci --strict-allow-scripts
          npx playwright install --with-deps chromium

      - name: Check Midscene model vision
        working-directory: tests/midscene
        env: *model-env
        run: npm run check:model-vision

      - name: Type-check Midscene custom nodes
        # npm test loads midscene.config.ts via tsx/esbuild without semantic
        # TS checks, so run the standalone package's tsc before the expensive
        # browser run.
        working-directory: tests/midscene
        run: npm run typecheck

      - name: Install Rome workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # dev:mock:e2e runs build:kit before rsbuild dev, so first-request readiness
      # can take a few minutes after the job starts.
      - name: Start the target (Rome mock server)
        run: |
          nohup pnpm --filter rome-web dev:mock:e2e > /tmp/rome-devmock.log 2>&1 &
          for _ in $(seq 1 180); do
            if curl -sf http://localhost:3200/ -o /dev/null; then
              echo "dev:mock:e2e is ready"
              exit 0
            fi
            sleep 2
          done
          echo "dev:mock:e2e failed to become ready" >&2
          tail -n 100 /tmp/rome-devmock.log >&2
          exit 1

      - name: Check browser network boundary
        working-directory: tests/midscene
        run: npm run check:browser-boundary

      - name: Run the suite
        working-directory: tests/midscene
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
          MIDSCENE_REPLANNING_CYCLE_LIMIT: "40"
          MIDSCENE_RETRY: "2"
        run: timeout --signal=TERM --kill-after=10s 80m npm test

      - name: Record report model
        if: always()
        working-directory: tests/midscene
        env: *model-env
        run: node scripts/record-report-model.mjs

      - name: Upload the suite report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: midscene-suite-mock
          path: |
            tests/midscene/midscene_run/
            tests/midscene/.midscene/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the target log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: target-log-mock
          path: /tmp/rome-devmock.log
          if-no-files-found: warn
          retention-days: 14

  backend:
    needs: [harness-validation, mock]
    name: "Midscene suite: backend"
    # The same trust gate as `mock`. It runs after `mock`, never beside it,
    # because both share the Midscene endpoint's tokens-per-minute ceiling; a
    # failed or skipped `mock` does not stop it.
    if: >-
      always() && !cancelled() && needs.harness-validation.result == 'success' &&
      inputs.report_source_run_id == '' && inputs.suite != 'mock' &&
      needs.harness-validation.outputs.upstream-repository != '' &&
      (github.repository == needs.harness-validation.outputs.upstream-repository && github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.repository != needs.harness-validation.outputs.upstream-repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HEADLESS: "true"
      ROME_E2E_BASE_URL: http://127.0.0.1:8090
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
      # The image published from main twice a day; the Summary records which
      # commit it was built from.
      ROME_E2E_IMAGE: zoolsher/rome:latest
      ROME_E2E_EVENTS_FILE: ${{ github.workspace }}/tests/midscene/midscene_run/backend/events.jsonl
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/midscene/package-lock.json

      - name: Require Midscene and Rome model configuration
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
          ROME_E2E_ANTHROPIC_ENV_JSON: ${{ secrets.ROME_E2E_ANTHROPIC_ENV_JSON }}
        run: |
          test -n "$MIDSCENE_MODEL_API_KEY"
          test -n "$MIDSCENE_MODEL_NAME"
          test -n "$MIDSCENE_MODEL_BASE_URL"
          test -n "$MIDSCENE_MODEL_FAMILY"
          test -n "$ROME_E2E_ANTHROPIC_ENV_JSON"
          # GitHub masks the secret as a whole, not a token printed on its own.
          node --input-type=module <<'NODE'
          const parsed = JSON.parse(process.env.ROME_E2E_ANTHROPIC_ENV_JSON);
          for (const value of Object.values(parsed.env ?? parsed)) {
            if (typeof value === "string" && value.length >= 8) console.log(`::add-mask::${value}`);
          }
          NODE

      - name: Install Midscene test dependencies
        working-directory: tests/midscene
        run: |
          npm ci --strict-allow-scripts
          npx playwright install --with-deps chromium

      - name: Check Midscene model vision
        working-directory: tests/midscene
        env: *model-env
        run: npm run check:model-vision

      - name: Type-check Midscene custom nodes
        working-directory: tests/midscene
        run: npm run typecheck

      - name: Pull the published image
        run: |
          docker pull "$ROME_E2E_IMAGE"
          docker image inspect "$ROME_E2E_IMAGE" \
            --format 'Image built from {{ index .Config.Labels "org.opencontainers.image.revision" }} at {{ .Created }}'

      - name: Start the target (Rome container)
        run: tests/midscene/backend/instance.sh up

      - name: Run the suite
        working-directory: tests/midscene
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
          MIDSCENE_REPLANNING_CYCLE_LIMIT: "40"
          ROME_E2E_ANTHROPIC_ENV_JSON: ${{ secrets.ROME_E2E_ANTHROPIC_ENV_JSON }}
        run: timeout --signal=TERM --kill-after=10s 35m npm run test:backend

      - name: Collect the container log and anomalies
        if: always()
        run: |
          tests/midscene/backend/instance.sh collect tests/midscene/midscene_run/backend
          revision=$(docker image inspect "$ROME_E2E_IMAGE" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' || true)
          node tests/midscene/scripts/backend-anomalies.mjs \
            --rome-log tests/midscene/midscene_run/backend/rome.log \
            --events "$ROME_E2E_EVENTS_FILE" \
            --image "$ROME_E2E_IMAGE@$revision" \
            --out tests/midscene/midscene_run/backend

      - name: Record report model
        if: always()
        working-directory: tests/midscene
        env: *model-env
        run: node scripts/record-report-model.mjs

      # The report is published like the mock report, so nothing is uploaded
      # unless this scan passes: GitHub masks secrets in step logs but not
      # inside artifacts.
      - name: Scan the suite report for secrets
        id: secret-scan
        if: always()
        working-directory: tests/midscene
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          ROME_E2E_ANTHROPIC_ENV_JSON: ${{ secrets.ROME_E2E_ANTHROPIC_ENV_JSON }}
        run: node scripts/backend-secret-scan.mjs midscene_run .midscene

      - name: Upload the suite report
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: midscene-suite-backend
          path: |
            tests/midscene/midscene_run/
            tests/midscene/.midscene/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  report-summary:
    name: Merge Midscene reports
    needs: [harness-validation, mock, backend]
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (needs.mock.result != 'skipped' || needs.backend.result != 'skipped' ||
      inputs.report_source_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      report-artifact-name: ${{ steps.upload-report.outcome == 'success' && 'midscene-e2e-report' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/midscene/package-lock.json

      - name: Install Midscene report merger
        working-directory: tests/midscene
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --strict-allow-scripts

      - name: Validate report source run
        if: inputs.report_source_run_id != ''
        env:
          REPORT_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node tests/midscene/scripts/trusted-report-runs.mjs validate-source

      # Separate directories preserve reports whose generated filenames match
      # across suites.
      - name: Download every Midscene suite
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-suite-*
          run-id: ${{ inputs.report_source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/midscene-reports
          merge-multiple: false

      - name: Merge native Midscene Test reports
        id: native-report
        continue-on-error: true
        working-directory: tests/midscene
        env:
          EXPECTED_PROJECTS: ${{ needs.harness-validation.outputs.projects }}
        run: |
          node scripts/merge-native-reports.mjs \
            "$RUNNER_TEMP/midscene-reports" \
            "$EXPECTED_PROJECTS" \
            "case-manifest.json"
          if [ -f "$RUNNER_TEMP/midscene-reports/native-report/index.html" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Discard output from a failed native merge
        if: steps.native-report.outcome == 'failure'
        run: |
          node --input-type=module <<'NODE'
          import { rm } from 'node:fs/promises';
          import path from 'node:path';
          await rm(path.join(process.env.RUNNER_TEMP, 'midscene-reports', 'native-report'), {
            recursive: true,
            force: true,
          });
          NODE

      - name: Render case table
        id: case-table
        continue-on-error: true
        env:
          EXPECTED_PROJECTS: ${{ needs.harness-validation.outputs.projects }}
          PRODUCER_RESULT: >-
            ${{ (inputs.report_source_run_id != '' ||
            (needs.mock.result == 'success' || needs.mock.result == 'skipped') &&
            (needs.backend.result == 'success' || needs.backend.result == 'skipped')) && 'success' || 'failure' }}
        run: |
          node tests/midscene/scripts/render-ci-summary.mjs \
            --reports-dir "$RUNNER_TEMP/midscene-reports" \
            --expected-projects "$EXPECTED_PROJECTS" \
            --case-manifest "tests/midscene/case-manifest.json" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --producer-result "$PRODUCER_RESULT" \
            --output "$RUNNER_TEMP/midscene-reports/summary.md"

      - name: Upload combined Midscene report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: midscene-e2e-report
          include-hidden-files: true
          path: ${{ runner.temp }}/midscene-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Require complete native report
        if: >-
          steps.native-report.outcome != 'success' ||
          steps.native-report.outputs.available != 'true' ||
          steps.case-table.outcome != 'success'
        run: |
          echo "The native Midscene Test report is incomplete; see the run Summary and suite artifacts." >&2
          exit 1

  available-results:
    name: Midscene results before publication
    needs: [mock, backend, report-summary]
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (needs.mock.result != 'skipped' || needs.backend.result != 'skipped' ||
      inputs.report_source_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Download available results
        id: report
        if: needs.report-summary.outputs.report-artifact-name != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.report-summary.outputs.report-artifact-name }}
          path: ${{ runner.temp }}/midscene-results

      - name: Show results without waiting for Pages
        if: always()
        env:
          REPORT_RESULT: ${{ needs.report-summary.result }}
        run: |
          if [ -f "$RUNNER_TEMP/midscene-results/summary.md" ]; then
            cat "$RUNNER_TEMP/midscene-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Midscene results"
              echo
              echo "Report aggregation: $REPORT_RESULT. Case counts are unavailable."
              echo
              echo "[Inspect this run and available suite artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  prepare-pages:
    name: Prepare optional Midscene Pages publication
    needs: [harness-validation, report-summary]
    # Publication never runs on contributor-controlled pull request code.
    # Upstream is enabled in code; each fork must opt in by its exact full name.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_pages) &&
      needs.harness-validation.outputs.upstream-repository != '' &&
      (github.repository == needs.harness-validation.outputs.upstream-repository && github.ref == 'refs/heads/main' ||
      github.repository != needs.harness-validation.outputs.upstream-repository && github.repository == vars.MIDSCENE_PUBLISH_REPO && github.event_name == 'workflow_dispatch') &&
      needs.report-summary.outputs.report-artifact-name != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: read
    outputs:
      pages-artifact-name: ${{ steps.upload-pages.outcome == 'success' && steps.pages-artifact.outputs.name || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Explain unavailable Pages configuration
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is unavailable. A maintainer must select Settings > Pages > Build and deployment > Source > GitHub Actions."

      - name: Download combined Midscene report
        if: steps.pages.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.report-summary.outputs.report-artifact-name }}
          path: ${{ runner.temp }}/midscene-reports

      - name: Find the latest published report artifact
        id: previous-report
        if: steps.pages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/midscene/scripts/trusted-report-runs.mjs find-previous

      - name: Download the latest published report
        if: steps.pages.outcome == 'success' && steps.previous-report.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.previous-report.outputs.name }}
          run-id: ${{ steps.previous-report.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-pages-artifact

      - name: Extract the latest published report
        if: steps.pages.outcome == 'success' && steps.previous-report.outputs.run_id != ''
        run: |
          mkdir -p "$RUNNER_TEMP/previous-pages"
          tar -xf "$RUNNER_TEMP/previous-pages-artifact/artifact.tar" -C "$RUNNER_TEMP/previous-pages"

      - name: Prepare published report
        if: steps.pages.outcome == 'success'
        run: |
          node tests/midscene/scripts/prepare-pages-site.mjs \
            --site "$RUNNER_TEMP/midscene-pages" \
            --reports "$RUNNER_TEMP/midscene-reports" \
            --run-id "$GITHUB_RUN_ID" \
            --previous "$RUNNER_TEMP/previous-pages"

      - name: Name GitHub Pages artifact
        id: pages-artifact
        if: steps.pages.outcome == 'success'
        run: echo "name=midscene-e2e-report-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages report
        id: upload-pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: ${{ runner.temp }}/midscene-pages
          retention-days: 90

  deploy-report:
    name: Publish Midscene HTML report
    needs: prepare-pages
    if: >-
      always() && !cancelled() &&
      needs.prepare-pages.outputs.pages-artifact-name != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: midscene-pages-report
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.prepare-pages.outputs.pages-artifact-name }}

  report-results:
    name: Midscene results
    needs: [harness-validation, mock, backend, report-summary, prepare-pages, deploy-report]
    # Results are already visible in available-results while Pages awaits approval.
    # This Summary adds publication status and verified report links.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (needs.mock.result != 'skipped' || needs.backend.result != 'skipped' ||
      inputs.report_source_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Validate report source run
        id: source-run
        if: inputs.report_source_run_id != ''
        continue-on-error: true
        env:
          REPORT_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node tests/midscene/scripts/trusted-report-runs.mjs validate-source

      - name: Download combined Midscene report
        id: combined-report
        if: >-
          needs.report-summary.outputs.report-artifact-name != '' &&
          (inputs.report_source_run_id == '' || steps.source-run.outcome == 'success')
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.report-summary.outputs.report-artifact-name }}
          path: ${{ runner.temp }}/midscene-combined-report

      - name: Recover available suite reports
        if: >-
          steps.combined-report.outcome != 'success' &&
          (inputs.report_source_run_id == '' || steps.source-run.outcome == 'success')
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-suite-*
          run-id: ${{ inputs.report_source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/midscene-reports
          merge-multiple: false

      - name: Write the consolidated run Summary
        if: always()
        env:
          PAGE_URL: ${{ needs.deploy-report.result == 'success' && needs.deploy-report.outputs.page-url || '' }}
          REPORT_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
          REPORTS_DIR: ${{ steps.combined-report.outcome == 'success' && 'midscene-combined-report' || 'midscene-reports' }}
          EXPECTED_PROJECTS: ${{ needs.harness-validation.outputs.projects }}
          PRODUCER_RESULT: >-
            ${{ needs.report-summary.result == 'success' && (inputs.report_source_run_id != '' ||
            (needs.mock.result == 'success' || needs.mock.result == 'skipped') &&
            (needs.backend.result == 'success' || needs.backend.result == 'skipped')) && 'success' || 'failure' }}
          REPORT_RESULT: ${{ needs.report-summary.result }}
          PUBLICATION_RESULT: ${{ needs.prepare-pages.result == 'failure' && 'failure' || needs.deploy-report.result }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          pages_url=""
          if [ -n "$PAGE_URL" ]; then
            pages_url="${PAGE_URL%/}/runs/$GITHUB_RUN_ID/"
          fi
          if node tests/midscene/scripts/render-ci-summary.mjs \
            --reports-dir "$RUNNER_TEMP/$REPORTS_DIR" \
            --expected-projects "$EXPECTED_PROJECTS" \
            --case-manifest "tests/midscene/case-manifest.json" \
            --run-url "$run_url" \
            --pages-url "$pages_url" \
            --source-run-id "$REPORT_SOURCE_RUN_ID" \
            --producer-result "$PRODUCER_RESULT" \
            --report-result "$REPORT_RESULT" \
            --publication-result "$PUBLICATION_RESULT" \
            --output "$RUNNER_TEMP/midscene-summary.md"; then
            cat "$RUNNER_TEMP/midscene-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Rome × Midscene · Summary unavailable"
              echo
              echo "Case counts could not be read. Aggregation: $REPORT_RESULT. Pages: $PUBLICATION_RESULT."
              echo
              echo "[Inspect this run and available artifacts]($run_url#artifacts)."
              if [[ "$REPORT_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
                echo "[Inspect source-run artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$REPORT_SOURCE_RUN_ID#artifacts)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
