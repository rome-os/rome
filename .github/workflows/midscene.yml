name: E2E Testing by Midscene

# Visual E2E against the strict MSW mock build (pnpm --filter rome-web dev:mock:e2e,
# port 3200). Every case uses only synthetic in-repo fixtures; no real backend
# or personal data is involved. Model credentials come from repository secrets.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC / 14:00 Beijing daily
  pull_request:
    paths:
      - ".github/workflows/midscene.yml"
      - "tests/midscene/**"
      - "docs/midscene-e2e-cases.md"
      - "packages/web/**"
      - "packages/api-types/**"
      - "packages/app-runtime-sdk/**"
      - "packages/ui/**"
      - "packages/web-content/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      report_source_run_id:
        description: Rebuild the Summary from an existing run's shard artifacts without model calls
        required: false
        type: string
      publish_pages:
        description: Publish reports to Pages when this repository is enabled
        required: false
        type: boolean
        default: true

# Credential trust model:
# The four MIDSCENE_MODEL_* secrets are billable, and a pull_request job runs
# contributor-controlled code with the secrets in its environment. Naming a
# protected environment in the workflow does not create its reviewer gate — an
# absent environment is provisioned open — so until a maintainer actually
# configures a protected environment with required reviewers, the secret-
# bearing path (the `midscene` matrix) is restricted to the protected main
# branch in the upstream repository. Fork owners may explicitly dispatch a
# fork branch with their fork's own secrets. Pull requests run secret-free
# harness and mock-browser boundary jobs. Reports are always aggregated after
# model runs. Pages publication is enabled upstream and opt-in for forks.

permissions:
  contents: read

concurrency:
  group: midscene-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  MIDSCENE_UPSTREAM_REPOSITORY: rome-os/rome

jobs:
  harness-validation:
    name: Midscene harness validation (no secrets)
    outputs:
      upstream-repository: ${{ env.MIDSCENE_UPSTREAM_REPOSITORY }}
    # Runs on path-filtered PRs, nightly, and manual dispatch: validates the package
    # without model secrets, a browser download, the Rome workspace install,
    # or the mock server. Loading the config and collecting YAML cases never
    # calls chromium.launch or the model, so contributor-controlled PR code
    # reaches no credentials here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/midscene/package-lock.json

      - name: Install Midscene test dependencies
        # This job never launches a browser; skip the playwright postinstall
        # download. Importing the playwright package (for its types/API) does
        # not require the browser binaries.
        working-directory: tests/midscene
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --strict-allow-scripts

      - name: Type-check custom nodes
        working-directory: tests/midscene
        run: npm run typecheck

      - name: Collect workflow cases
        # Parses every cases/**/*.yaml and resolves node references exactly
        # like the runner; fails on schema errors or unknown nodes.
        working-directory: tests/midscene
        run: npm run collect

      - name: Test CI Summary renderer
        working-directory: tests/midscene
        run: npm run test:summary

  mock-boundary-validation:
    name: Midscene mock browser boundary (no secrets)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Enable pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Activate Node.js 24 and pnpm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Rome workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install browser test dependencies
        working-directory: tests/midscene
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --strict-allow-scripts
          npx playwright install --with-deps chromium

      - name: Start Rome mock server
        run: |
          nohup pnpm --filter rome-web dev:mock:e2e > /tmp/rome-devmock.log 2>&1 &
          for _ in $(seq 1 180); do
            if curl -sf http://localhost:3200/ -o /dev/null; then
              echo "dev:mock:e2e is ready"
              exit 0
            fi
            sleep 2
          done
          echo "dev:mock:e2e failed to become ready" >&2
          tail -n 100 /tmp/rome-devmock.log >&2
          exit 1

      - name: Check browser network boundary
        working-directory: tests/midscene
        run: npm run check:browser-boundary

      - name: Upload mock server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rome-devmock-pr
          path: /tmp/rome-devmock.log
          if-no-files-found: ignore

  midscene:
    needs: harness-validation
    name: "Midscene visual: ${{ matrix.label }} (${{ matrix.shard }})"
    # Fail-closed trust gate: contributor-controlled pull request code never
    # runs automatically with billable model credentials. Upstream runs only
    # on main; a fork owner may explicitly dispatch a fork ref with that fork's
    # own secrets.
    if: >-
      inputs.report_source_run_id == '' &&
      needs.harness-validation.outputs.upstream-repository != '' &&
      (github.repository == needs.harness-validation.outputs.upstream-repository && github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.repository != needs.harness-validation.outputs.upstream-repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The shared endpoint has a low tokens-per-minute ceiling. Serial visual
      # shards prevent concurrent screenshots from causing HTTP 429 failures.
      max-parallel: 1
      matrix:
        # Shards are selected by YAML tags (MIDSCENE_INCLUDE_TAGS), see
        # tests/midscene/README.md and docs/midscene-e2e-plan.md.
        include:
          - shard: shard-1
            label: Chat interactions
          - shard: shard-2
            label: Apps and chat cards
          - shard: shard-3
            label: Routines and sessions
          - shard: shard-4
            label: Files, people and activity
          - shard: shard-5
            label: Account and settings
          - shard: shard-6
            label: Recorded apps and navigation
    env:
      HEADLESS: "true"
      ROME_E2E_BASE_URL: http://localhost:3200
      # The model endpoint is reachable over IPv4; avoid family-race timeouts.
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # pnpm must exist before setup-node resolves the pnpm store for its
      # cache; without a version it reads the root `packageManager` field.
      - name: Enable pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Activate Node.js 24 and pnpm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Require Midscene model configuration
        env: &model-env
          # Scoped to the steps that actually call the model; install and the
          # mock server never see these variables.
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
        run: |
          test -n "$MIDSCENE_MODEL_API_KEY"
          test -n "$MIDSCENE_MODEL_NAME"
          test -n "$MIDSCENE_MODEL_BASE_URL"
          test -n "$MIDSCENE_MODEL_FAMILY"

      - name: Install Rome workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Midscene test dependencies
        # allowScripts for esbuild/sharp is declared in this package.json, so
        # npm ci runs their (approved) install scripts non-interactively.
        working-directory: tests/midscene
        run: |
          npm ci --strict-allow-scripts
          npx playwright install --with-deps chromium

      - name: Check Midscene model vision
        working-directory: tests/midscene
        env: *model-env
        run: npm run check:model-vision

      - name: Type-check Midscene custom nodes
        # npm test loads midscene.config.ts via tsx/esbuild without semantic
        # TS checks, so run the standalone package's tsc before the expensive
        # browser shards.
        working-directory: tests/midscene
        run: npm run typecheck

      # dev:mock:e2e runs build:kit before rsbuild dev, so first-request readiness
      # can take a few minutes after the job starts.
      - name: Start Rome mock server
        run: |
          nohup pnpm --filter rome-web dev:mock:e2e > /tmp/rome-devmock.log 2>&1 &
          for _ in $(seq 1 180); do
            if curl -sf http://localhost:3200/ -o /dev/null; then
              echo "dev:mock:e2e is ready"
              exit 0
            fi
            sleep 2
          done
          echo "dev:mock:e2e failed to become ready" >&2
          tail -n 100 /tmp/rome-devmock.log >&2
          exit 1

      - name: Check browser network boundary
        working-directory: tests/midscene
        run: npm run check:browser-boundary

      - name: Run Midscene shard
        id: run-shard
        working-directory: tests/midscene
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
          MIDSCENE_INCLUDE_TAGS: ${{ matrix.shard }}
          MIDSCENE_PROJECT_NAME: web-${{ matrix.shard }}
          MIDSCENE_REPLANNING_CYCLE_LIMIT: "40"
          MIDSCENE_RETRY: "2"
        run: timeout --signal=TERM --kill-after=10s 35m npm test

      - name: Record report model
        if: always()
        working-directory: tests/midscene
        env:
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          await mkdir('midscene_run', { recursive: true });
          await writeFile(
            'midscene_run/model.json',
            `${JSON.stringify({
              modelName: process.env.MIDSCENE_MODEL_NAME,
              modelFamily: process.env.MIDSCENE_MODEL_FAMILY,
            }, null, 2)}\n`,
          );
          NODE

      - name: Upload Midscene shard report
        id: upload-shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: midscene-${{ matrix.shard }}
          path: |
            tests/midscene/midscene_run/
            tests/midscene/.midscene/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mock server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rome-devmock-${{ matrix.shard }}
          path: /tmp/rome-devmock.log
          if-no-files-found: warn
          retention-days: 14

  report-summary:
    name: Merge Midscene reports
    needs: midscene
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (needs.midscene.result != 'skipped' || inputs.report_source_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      report-artifact-name: ${{ steps.upload-report.outcome == 'success' && 'midscene-e2e-report' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/midscene/package-lock.json

      - name: Install Midscene report merger
        working-directory: tests/midscene
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --strict-allow-scripts

      - name: Validate report source run
        if: inputs.report_source_run_id != ''
        env:
          REPORT_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node tests/midscene/scripts/trusted-report-runs.mjs validate-source

      # Separate directories preserve reports whose generated filenames match
      # across serial shards.
      - name: Download every Midscene shard
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-shard-*
          run-id: ${{ inputs.report_source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/midscene-report-shards
          merge-multiple: false

      - name: Merge native Midscene Test reports
        id: native-report
        continue-on-error: true
        working-directory: tests/midscene
        run: |
          node scripts/merge-native-reports.mjs \
            "$RUNNER_TEMP/midscene-report-shards" \
            "web-shard-1,web-shard-2,web-shard-3,web-shard-4,web-shard-5,web-shard-6" \
            "case-manifest.json"
          if [ -f "$RUNNER_TEMP/midscene-report-shards/native-report/index.html" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Discard output from a failed native merge
        if: steps.native-report.outcome == 'failure'
        run: |
          node --input-type=module <<'NODE'
          import { rm } from 'node:fs/promises';
          import path from 'node:path';
          await rm(path.join(process.env.RUNNER_TEMP, 'midscene-report-shards', 'native-report'), {
            recursive: true,
            force: true,
          });
          NODE

      - name: Render case table
        id: case-table
        continue-on-error: true
        env:
          PRODUCER_RESULT: ${{ inputs.report_source_run_id != '' && 'success' || needs.midscene.result }}
        run: |
          node tests/midscene/scripts/render-ci-summary.mjs \
            --reports-dir "$RUNNER_TEMP/midscene-report-shards" \
            --expected-projects "web-shard-1,web-shard-2,web-shard-3,web-shard-4,web-shard-5,web-shard-6" \
            --case-manifest "tests/midscene/case-manifest.json" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --producer-result "$PRODUCER_RESULT" \
            --output "$RUNNER_TEMP/midscene-report-shards/summary.md"

      - name: Upload combined Midscene report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: midscene-e2e-report
          include-hidden-files: true
          path: ${{ runner.temp }}/midscene-report-shards/
          if-no-files-found: error
          retention-days: 14

      - name: Require complete native report
        if: >-
          steps.native-report.outcome != 'success' ||
          steps.native-report.outputs.available != 'true' ||
          steps.case-table.outcome != 'success'
        run: |
          echo "The native Midscene Test report is incomplete; see the run Summary and shard artifacts." >&2
          exit 1

  available-results:
    name: Midscene results before publication
    needs: [midscene, report-summary]
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (needs.midscene.result != 'skipped' || inputs.report_source_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Download available results
        id: report
        if: needs.report-summary.outputs.report-artifact-name != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.report-summary.outputs.report-artifact-name }}
          path: ${{ runner.temp }}/midscene-results

      - name: Show results without waiting for Pages
        if: always()
        env:
          REPORT_RESULT: ${{ needs.report-summary.result }}
        run: |
          if [ -f "$RUNNER_TEMP/midscene-results/summary.md" ]; then
            cat "$RUNNER_TEMP/midscene-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Midscene results"
              echo
              echo "Report aggregation: $REPORT_RESULT. Case counts are unavailable."
              echo
              echo "[Inspect this run and available shard artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  prepare-pages:
    name: Prepare optional Midscene Pages publication
    needs: [harness-validation, report-summary]
    # Publication never runs on contributor-controlled pull request code.
    # Upstream is enabled in code; each fork must opt in by its exact full name.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_pages) &&
      needs.harness-validation.outputs.upstream-repository != '' &&
      (github.repository == needs.harness-validation.outputs.upstream-repository && github.ref == 'refs/heads/main' ||
      github.repository != needs.harness-validation.outputs.upstream-repository && github.repository == vars.MIDSCENE_PUBLISH_REPO && github.event_name == 'workflow_dispatch') &&
      needs.report-summary.outputs.report-artifact-name != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: read
    outputs:
      pages-artifact-name: ${{ steps.upload-pages.outcome == 'success' && steps.pages-artifact.outputs.name || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Explain unavailable Pages configuration
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is unavailable. A maintainer must select Settings > Pages > Build and deployment > Source > GitHub Actions."

      - name: Download combined Midscene report
        if: steps.pages.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.report-summary.outputs.report-artifact-name }}
          path: ${{ runner.temp }}/midscene-report-shards

      - name: Find the latest published report artifact
        id: previous-report
        if: steps.pages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/midscene/scripts/trusted-report-runs.mjs find-previous

      - name: Download the latest published report
        if: steps.pages.outcome == 'success' && steps.previous-report.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.previous-report.outputs.name }}
          run-id: ${{ steps.previous-report.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-pages-artifact

      - name: Extract the latest published report
        if: steps.pages.outcome == 'success' && steps.previous-report.outputs.run_id != ''
        run: |
          mkdir -p "$RUNNER_TEMP/previous-pages"
          tar -xf "$RUNNER_TEMP/previous-pages-artifact/artifact.tar" -C "$RUNNER_TEMP/previous-pages"

      - name: Prepare published report
        if: steps.pages.outcome == 'success'
        run: |
          node tests/midscene/scripts/prepare-pages-site.mjs \
            --site "$RUNNER_TEMP/midscene-pages" \
            --reports "$RUNNER_TEMP/midscene-report-shards" \
            --run-id "$GITHUB_RUN_ID" \
            --previous "$RUNNER_TEMP/previous-pages"

      - name: Name GitHub Pages artifact
        id: pages-artifact
        if: steps.pages.outcome == 'success'
        run: echo "name=midscene-e2e-report-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages report
        id: upload-pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: ${{ runner.temp }}/midscene-pages
          retention-days: 90

  deploy-report:
    name: Publish Midscene HTML report
    needs: prepare-pages
    if: >-
      always() && !cancelled() &&
      needs.prepare-pages.outputs.pages-artifact-name != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: midscene-pages-report
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.prepare-pages.outputs.pages-artifact-name }}

  report-results:
    name: Midscene results
    needs: [midscene, report-summary, prepare-pages, deploy-report]
    # Results are already visible in available-results while Pages awaits approval.
    # This Summary adds publication status and verified report links.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (needs.midscene.result != 'skipped' || inputs.report_source_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Validate report source run
        id: source-run
        if: inputs.report_source_run_id != ''
        continue-on-error: true
        env:
          REPORT_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node tests/midscene/scripts/trusted-report-runs.mjs validate-source

      - name: Download combined Midscene report
        id: combined-report
        if: >-
          needs.report-summary.outputs.report-artifact-name != '' &&
          (inputs.report_source_run_id == '' || steps.source-run.outcome == 'success')
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.report-summary.outputs.report-artifact-name }}
          path: ${{ runner.temp }}/midscene-combined-report

      - name: Recover available shard reports
        if: >-
          steps.combined-report.outcome != 'success' &&
          (inputs.report_source_run_id == '' || steps.source-run.outcome == 'success')
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-shard-*
          run-id: ${{ inputs.report_source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/midscene-report-shards
          merge-multiple: false

      - name: Write the consolidated run Summary
        if: always()
        env:
          PAGE_URL: ${{ needs.deploy-report.result == 'success' && needs.deploy-report.outputs.page-url || '' }}
          REPORT_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
          REPORTS_DIR: ${{ steps.combined-report.outcome == 'success' && 'midscene-combined-report' || 'midscene-report-shards' }}
          PRODUCER_RESULT: ${{ needs.report-summary.result == 'success' && (inputs.report_source_run_id != '' || needs.midscene.result == 'success') && 'success' || 'failure' }}
          REPORT_RESULT: ${{ needs.report-summary.result }}
          PUBLICATION_RESULT: ${{ needs.prepare-pages.result == 'failure' && 'failure' || needs.deploy-report.result }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          pages_url=""
          if [ -n "$PAGE_URL" ]; then
            pages_url="${PAGE_URL%/}/runs/$GITHUB_RUN_ID/"
          fi
          if node tests/midscene/scripts/render-ci-summary.mjs \
            --reports-dir "$RUNNER_TEMP/$REPORTS_DIR" \
            --expected-projects "web-shard-1,web-shard-2,web-shard-3,web-shard-4,web-shard-5,web-shard-6" \
            --case-manifest "tests/midscene/case-manifest.json" \
            --run-url "$run_url" \
            --pages-url "$pages_url" \
            --source-run-id "$REPORT_SOURCE_RUN_ID" \
            --producer-result "$PRODUCER_RESULT" \
            --report-result "$REPORT_RESULT" \
            --publication-result "$PUBLICATION_RESULT" \
            --output "$RUNNER_TEMP/midscene-summary.md"; then
            cat "$RUNNER_TEMP/midscene-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Rome × Midscene · Summary unavailable"
              echo
              echo "Case counts could not be read. Aggregation: $REPORT_RESULT. Pages: $PUBLICATION_RESULT."
              echo
              echo "[Inspect this run and available artifacts]($run_url#artifacts)."
              if [[ "$REPORT_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
                echo "[Inspect source-run artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$REPORT_SOURCE_RUN_ID#artifacts)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
