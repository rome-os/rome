name: Midscene E2E

# Visual E2E against the MSW mock build (pnpm --filter rome-web dev:mock,
# port 3200). Every case uses only synthetic in-repo fixtures; no real backend
# or personal data is involved. Model credentials come from repository secrets.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/midscene.yml"
      - "tests/midscene/**"
      - "packages/web/**"
      # Workspace dependencies rebuilt by `pnpm --filter rome-web^... build`
      # (build:kit) before dev:mock serves the UI; changes there can alter
      # every flow under test.
      - "packages/api-types/**"
      - "packages/app-runtime-sdk/**"
      - "packages/ui/**"
      - "packages/web-content/**"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - ".github/workflows/midscene.yml"
      - "tests/midscene/**"
      - "packages/web/**"
      - "packages/api-types/**"
      - "packages/app-runtime-sdk/**"
      - "packages/ui/**"
      - "packages/web-content/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      report_source_run_id:
        description: Rebuild the Summary from an existing run's shard artifacts without model calls
        required: false
        type: string

# Credential trust model:
# The four MIDSCENE_MODEL_* secrets are billable, and a pull_request job runs
# contributor-controlled code with the secrets in its environment. Naming a
# protected environment in the workflow does not create its reviewer gate — an
# absent environment is provisioned open — so until a maintainer actually
# configures a protected environment with required reviewers, the secret-
# bearing path (the `midscene` matrix) is restricted to the protected main
# branch in the upstream repository. Fork owners may explicitly dispatch a
# fork branch with their fork's own secrets. Pull requests still run only the
# secret-free `harness-validation` job (npm ci, type-check, and YAML case
# collection). Only quanru/rome renders and publishes reports.

permissions:
  contents: read

concurrency:
  group: midscene-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-validation:
    name: Midscene harness validation (no secrets)
    # Runs on every PR and on main: validates the standalone test package
    # without model secrets, a browser download, the Rome workspace install,
    # or the mock server. Loading the config and collecting YAML cases never
    # calls chromium.launch or the model, so contributor-controlled PR code
    # reaches no credentials here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Activate Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/midscene/package-lock.json

      - name: Install Midscene test dependencies
        # This job never launches a browser; skip the playwright postinstall
        # download. Importing the playwright package (for its types/API) does
        # not require the browser binaries.
        working-directory: tests/midscene
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Type-check custom nodes
        working-directory: tests/midscene
        run: npm run typecheck

      - name: Collect workflow cases
        # Parses every cases/**/*.yaml and resolves node references exactly
        # like the runner; fails on schema errors or unknown nodes.
        working-directory: tests/midscene
        run: npm run collect

      - name: Test CI Summary renderer
        if: github.repository == 'quanru/rome'
        working-directory: tests/midscene
        run: npm run test:summary

  midscene:
    name: Midscene visual (${{ matrix.shard }})
    # Fail-closed trust gate: contributor-controlled pull request code never
    # runs automatically with billable model credentials. Upstream runs only
    # on main; a fork owner may explicitly dispatch a fork ref with that fork's
    # own secrets.
    if: >-
      inputs.report_source_run_id == '' &&
      (github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.repository != 'rome-os/rome'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The shared endpoint has a low tokens-per-minute ceiling. Serial visual
      # shards prevent concurrent screenshots from causing HTTP 429 failures.
      max-parallel: 1
      matrix:
        # Shards are selected by YAML tags (MIDSCENE_INCLUDE_TAGS), see
        # tests/midscene/README.md and docs/midscene-e2e-plan.md.
        shard:
          - shard-1
          - shard-2
          - shard-3
          - shard-4
          - shard-5
          - shard-6
    env:
      HEADLESS: "true"
      ROME_E2E_BASE_URL: http://localhost:3200
      # The model endpoint is reachable over IPv4; avoid family-race timeouts.
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # pnpm must exist before setup-node resolves the pnpm store for its
      # cache; without a version it reads the root `packageManager` field.
      - name: Enable pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Activate Node.js 24 and pnpm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Require Midscene model configuration
        env: &model-env
          # Scoped to the steps that actually call the model; install and the
          # mock server never see these variables.
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
        run: |
          test -n "$MIDSCENE_MODEL_API_KEY"
          test -n "$MIDSCENE_MODEL_NAME"
          test -n "$MIDSCENE_MODEL_BASE_URL"
          test -n "$MIDSCENE_MODEL_FAMILY"

      - name: Install Rome workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Midscene test dependencies
        # allowScripts for esbuild/sharp is declared in this package.json, so
        # npm ci runs their (approved) install scripts non-interactively.
        working-directory: tests/midscene
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check Midscene model vision
        working-directory: tests/midscene
        env: *model-env
        run: npm run check:model-vision

      - name: Type-check Midscene custom nodes
        # npm test loads midscene.config.ts via tsx/esbuild without semantic
        # TS checks, so run the standalone package's tsc before the expensive
        # browser shards.
        working-directory: tests/midscene
        run: npm run typecheck

      # dev:mock runs build:kit before rsbuild dev, so first-request readiness
      # can take a few minutes after the job starts.
      - name: Start Rome mock server
        run: |
          nohup pnpm --filter rome-web dev:mock > /tmp/rome-devmock.log 2>&1 &
          for _ in $(seq 1 180); do
            if curl -sf http://localhost:3200/ -o /dev/null; then
              echo "dev:mock is ready"
              exit 0
            fi
            sleep 2
          done
          echo "dev:mock failed to become ready" >&2
          tail -n 100 /tmp/rome-devmock.log >&2
          exit 1

      - name: Run Midscene shard
        working-directory: tests/midscene
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
          MIDSCENE_INCLUDE_TAGS: ${{ matrix.shard }}
          MIDSCENE_PROJECT_NAME: web-${{ matrix.shard }}
          MIDSCENE_REPLANNING_CYCLE_LIMIT: "40"
          MIDSCENE_RETRY: "2"
        run: timeout --signal=TERM --kill-after=10s 35m npm test

      - name: Record report model
        if: always()
        working-directory: tests/midscene
        env:
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          await mkdir('midscene_run', { recursive: true });
          await writeFile(
            'midscene_run/model.json',
            `${JSON.stringify({
              modelName: process.env.MIDSCENE_MODEL_NAME,
              modelFamily: process.env.MIDSCENE_MODEL_FAMILY,
            }, null, 2)}\n`,
          );
          NODE

      - name: Upload Midscene shard report
        if: always() && github.repository == 'quanru/rome'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: midscene-${{ matrix.shard }}
          path: |
            tests/midscene/midscene_run/
            tests/midscene/.midscene/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mock server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rome-devmock-${{ matrix.shard }}
          path: /tmp/rome-devmock.log
          if-no-files-found: warn
          retention-days: 14

  report-summary:
    name: Assemble Midscene report and Summary
    needs: midscene
    if: >-
      always() && !cancelled() &&
      (needs.midscene.result != 'skipped' || inputs.report_source_run_id != '') &&
      github.repository == 'quanru/rome'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pages: write
    outputs:
      pages-artifact-name: ${{ steps.pages-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate report source run
        if: inputs.report_source_run_id != ''
        env:
          REPORT_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
        run: |
          [[ "$REPORT_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]

      # Separate directories preserve reports whose generated filenames match
      # across serial shards.
      - name: Download every Midscene shard
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-shard-*
          run-id: ${{ inputs.report_source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/midscene-report-shards
          merge-multiple: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Find the latest published report artifact
        id: previous-report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("midscene-e2e-report-pages-")) | select(.expired == false)][0]')
          if [ "$artifact" != "null" ]; then
            echo "name=$(jq -r .name <<< "$artifact")" >> "$GITHUB_OUTPUT"
            echo "run_id=$(jq -r .workflow_run.id <<< "$artifact")" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the latest published report
        if: steps.previous-report.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.previous-report.outputs.name }}
          run-id: ${{ steps.previous-report.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-pages-artifact

      - name: Extract the latest published report
        if: steps.previous-report.outputs.run_id != ''
        run: |
          mkdir -p "$RUNNER_TEMP/previous-pages"
          tar -xf "$RUNNER_TEMP/previous-pages-artifact/artifact.tar" -C "$RUNNER_TEMP/previous-pages"

      - name: Download report for the affected historical run
        if: steps.previous-report.outputs.run_id == '35816486576'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: midscene-e2e-report-pages-1
          run-id: 35734638707
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/legacy-pages-artifact

      - name: Extract report for the affected historical run
        if: steps.previous-report.outputs.run_id == '35816486576'
        run: |
          mkdir -p "$RUNNER_TEMP/legacy-pages"
          tar -xf "$RUNNER_TEMP/legacy-pages-artifact/artifact.tar" -C "$RUNNER_TEMP/legacy-pages"

      - name: Render case table
        env:
          PRODUCER_RESULT: ${{ inputs.report_source_run_id != '' && 'success' || needs.midscene.result }}
        run: |
          node tests/midscene/scripts/render-ci-summary.mjs \
            --reports-dir "$RUNNER_TEMP/midscene-report-shards" \
            --expected-projects "web-shard-1,web-shard-2,web-shard-3,web-shard-4,web-shard-5,web-shard-6" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --pages-url "${{ steps.pages.outputs.base_url }}/runs/$GITHUB_RUN_ID/" \
            --producer-result "$PRODUCER_RESULT" \
            --output "$RUNNER_TEMP/midscene-summary.md" \
            --html-output "$RUNNER_TEMP/midscene-report-shards/index.html"

      - name: Prepare published report
        run: |
          node tests/midscene/scripts/prepare-pages-site.mjs \
            --site "$RUNNER_TEMP/midscene-pages" \
            --reports "$RUNNER_TEMP/midscene-report-shards" \
            --run-id "$GITHUB_RUN_ID" \
            --previous "$RUNNER_TEMP/previous-pages" \
            --previous-run-id "${{ steps.previous-report.outputs.run_id }}" \
            --legacy "$RUNNER_TEMP/legacy-pages" \
            --legacy-run-id "35734638707"

      - name: Add case table to the run Summary
        env:
          REPORT_SOURCE_RUN_ID: ${{ inputs.report_source_run_id }}
        run: |
          if [ -n "$REPORT_SOURCE_RUN_ID" ]; then
            echo "Report rebuilt from [run $REPORT_SOURCE_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$REPORT_SOURCE_RUN_ID) without new model calls." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$RUNNER_TEMP/midscene-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined Midscene report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: midscene-e2e-report
          path: ${{ runner.temp }}/midscene-report-shards/
          if-no-files-found: error
          retention-days: 14

      - name: Name GitHub Pages artifact
        id: pages-artifact
        run: echo "name=midscene-e2e-report-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages report
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: ${{ runner.temp }}/midscene-pages
          retention-days: 90

  deploy-report:
    name: Publish Midscene HTML report
    needs: report-summary
    if: always() && github.repository == 'quanru/rome' && needs.report-summary.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: midscene-pages-report
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.report-summary.outputs.pages-artifact-name }}
