name: Package publish

# Reusable workflow that builds and publishes Rome's @rome-os packages to npm.
# release.yml is the single publish entrypoint:
#
#   - Automatic release publishes pass the JSON list of bumped paths after
#     release-please cuts a release.
#   - Manual hotfix/retry publishes pass a package selector from release.yml's
#     workflow_dispatch form.
#
# In both cases the version published is whatever sits in the package.json
# of the matched path on the caller ref. The workflow does NOT bump
# versions — that is release-please's job (or a manual edit on main).

on:
  workflow_call:
    inputs:
      paths:
        description: JSON array of package paths to publish (e.g. ["packages/app-runtime-sdk"])
        required: false
        type: string
      package:
        description: Which package to publish when paths is not provided.
        required: false
        type: string
        default: all
      dry_run:
        description: If true, npm runs --dry-run (package + validate, no upload).
        required: false
        type: boolean
        default: false
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_P8_CONTENT:
        required: false

jobs:
  prepare:
    name: Resolve publish targets
    runs-on: ubuntu-latest
    outputs:
      publish_node_core_darwin_arm64: ${{ steps.split.outputs.publish_node_core_darwin_arm64 }}
      publish_node_core: ${{ steps.split.outputs.publish_node_core }}
      publish_node_cli: ${{ steps.split.outputs.publish_node_cli }}
      other_paths: ${{ steps.split.outputs.other_paths }}
      has_other_paths: ${{ steps.split.outputs.has_other_paths }}
    steps:
      - id: compute
        env:
          CALLER_PATHS: ${{ inputs.paths }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ -n "${CALLER_PATHS:-}" ]; then
            echo "paths=$CALLER_PATHS" >> "$GITHUB_OUTPUT"
          elif [ "${PACKAGE:-}" = "all" ]; then
            # Every package in release-please-config.json, each with a
            # configured npm Trusted Publisher. Keep the two lists in step: a
            # package listed here without a publisher fails every `all`
            # dispatch, and one missing from here is reachable only by name.
            # Automatic releases ignore this and take exact paths from
            # release-please.
            echo 'paths=["packages/app-runtime-sdk","packages/app-web-sdk","packages/ui","packages/lib","packages/web-content","packages/rome-node-cli","packages/rome-node-core","packages/rome-node-core-darwin-arm64"]' >> "$GITHUB_OUTPUT"
          elif [ -n "${PACKAGE:-}" ]; then
            echo "paths=$(jq -cn --arg pkg "$PACKAGE" '[$pkg]')" >> "$GITHUB_OUTPUT"
          else
            echo "No npm publish targets provided" >&2
            exit 1
          fi

      - id: split
        env:
          RESOLVED_PATHS: ${{ steps.compute.outputs.paths }}
        run: |
          set -euo pipefail
          publish_node_core_darwin_arm64="$(jq -rn --argjson paths "$RESOLVED_PATHS" '$paths | any(. == "packages/rome-node-core-darwin-arm64")')"
          publish_node_core="$(jq -rn --argjson paths "$RESOLVED_PATHS" '$paths | any(. == "packages/rome-node-core")')"
          publish_node_cli="$(jq -rn --argjson paths "$RESOLVED_PATHS" '$paths | any(. == "packages/rome-node-cli")')"
          other_paths="$(jq -cn --argjson paths "$RESOLVED_PATHS" '$paths | map(select(. != "packages/rome-node-core-darwin-arm64" and . != "packages/rome-node-core" and . != "packages/rome-node-cli"))')"
          has_other_paths="$(jq -rn --argjson paths "$other_paths" '($paths | length) > 0')"
          echo "publish_node_core_darwin_arm64=${publish_node_core_darwin_arm64}" >> "$GITHUB_OUTPUT"
          echo "publish_node_core=${publish_node_core}" >> "$GITHUB_OUTPUT"
          echo "publish_node_cli=${publish_node_cli}" >> "$GITHUB_OUTPUT"
          echo "other_paths=${other_paths}" >> "$GITHUB_OUTPUT"
          echo "has_other_paths=${has_other_paths}" >> "$GITHUB_OUTPUT"

  # Publish @rome-os/node-core-darwin-arm64 first on Apple Silicon so @rome-os/node-core
  # never publishes referencing a missing optional binary version.
  publish-node-core-darwin-arm64:
    name: Publish packages/rome-node-core-darwin-arm64
    needs: prepare
    if: ${{ needs.prepare.outputs.publish_node_core_darwin_arm64 == 'true' }}
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build signed and notarized computer-use helper
        uses: ./.github/actions/build-computer-use
        with:
          sign: "true"
          notarize: "true"
          certificate: ${{ secrets.CSC_LINK }}
          certificate-password: ${{ secrets.CSC_KEY_PASSWORD }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-issuer: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key: ${{ secrets.APP_STORE_CONNECT_P8_CONTENT }}

      - name: Publish to npm
        working-directory: packages/rome-node-core-darwin-arm64
        run: pnpm publish --access public --no-git-checks${{ inputs.dry_run && ' --dry-run' || '' }}

  publish-node-core:
    name: Publish packages/rome-node-core
    needs: [prepare, publish-node-core-darwin-arm64]
    if: >-
      ${{ !cancelled() &&
      needs.prepare.outputs.publish_node_core == 'true' &&
      (needs.prepare.outputs.publish_node_core_darwin_arm64 != 'true' ||
      needs.publish-node-core-darwin-arm64.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --dir packages/rome-node-core run build

      - name: Publish to npm
        working-directory: packages/rome-node-core
        run: pnpm publish --access public --no-git-checks${{ inputs.dry_run && ' --dry-run' || '' }}

  publish-node-cli:
    name: Publish packages/rome-node-cli
    needs: [prepare, publish-node-core-darwin-arm64, publish-node-core]
    if: >-
      ${{ !cancelled() &&
      needs.prepare.outputs.publish_node_cli == 'true' &&
      (needs.prepare.outputs.publish_node_core_darwin_arm64 != 'true' ||
      needs.publish-node-core-darwin-arm64.result == 'success') &&
      (needs.prepare.outputs.publish_node_core != 'true' ||
      needs.publish-node-core.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --dir packages/rome-node-cli run build

      - name: Publish to npm
        working-directory: packages/rome-node-cli
        run: pnpm publish --access public --no-git-checks${{ inputs.dry_run && ' --dry-run' || '' }}

  # Unrelated SDK packages publish directly without waiting on macOS signing/notarization.
  publish:
    name: Publish ${{ matrix.path }}
    needs: prepare
    if: ${{ needs.prepare.outputs.has_other_paths == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.prepare.outputs.other_paths) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --dir "${{ matrix.path }}" run build

      # pnpm 11 publishes natively, rewrites workspace protocol dependencies
      # in the packed manifest, and supports npm OIDC Trusted Publisher auth.
      # OIDC: the `id-token: write` job permission lets npm exchange the
      # GitHub token for an npm publish credential via the Trusted
      # Publisher mapping (no NPM_TOKEN).
      # `--provenance` is not set because it does not need to be: this
      # repository is public, so publishing through the Trusted Publisher
      # attaches a provenance attestation on its own. npm then checks the
      # packed manifest against it and rejects the upload with HTTP 422
      # unless `repository.url` resolves to this repository, so every
      # package here declares `repository` with its workspace `directory`.
      - name: Publish to npm
        working-directory: ${{ matrix.path }}
        run: pnpm publish --access public --no-git-checks${{ inputs.dry_run && ' --dry-run' || '' }}
