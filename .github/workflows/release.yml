name: Release

# Drives releases for Rome's public npm packages, Rome Node Docker image,
# and macOS Computer Use Helper via release-please.
#
# Flow:
#   1. PRs land on main with Conventional Commits messages (feat:, fix:, etc.).
#   2. The release-please job opens (or updates) a release PR that bumps
#      version + appends to CHANGELOG.md based on the unreleased commits.
#   3. Merging that release PR makes release-please cut a GitHub release and
#      tag for each package whose version moved. The publish jobs then build
#      and push the matching tarball(s) to npm and, when @rome-os/node
#      (packages/rome-node-cli) releases, publish the multi-platform
#      ghcr.io/rome-os/rome-node image (version, latest, and commit SHA).
#      When @rome-os/node-core releases, attach the Helper to its release.
#
# Bump rules: configured in release-please-config.json. Pre-1.0 we keep
# breaking → minor and feat/fix → patch (bump-minor-pre-major +
# bump-patch-for-minor-pre-major). Once a package cuts 1.0.0, drop those flags
# for that entry to get standard semver.
#
# Auth: publish runs against npm via OIDC (Trusted Publisher mapping for
# this repo + release.yml). No NPM_TOKEN required. Keep release.yml as the
# single publish entrypoint; sdk-publish.yml is only a reusable implementation.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        type: choice
        default: all
        # `all` covers every package below. Each stays individually
        # selectable for a dry run or a single-package retry.
        options:
          - all
          - packages/app-runtime-sdk
          - packages/app-web-sdk
          - packages/ui
          - packages/lib
          - packages/web-content
          - packages/rome-node-cli
          - packages/rome-node-core
      dry_run:
        description: Dry run (validate packages and the signed Helper without publishing).
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release:
    name: Publish release
    needs: release-please
    if: github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true'
    uses: ./.github/workflows/sdk-publish.yml
    with:
      paths: ${{ needs.release-please.outputs.paths_released }}
      dry_run: false

  publish-rome-node-image:
    name: Publish Rome Node image
    needs: release-please
    if: >-
      github.event_name == 'push' &&
      needs.release-please.outputs.releases_created == 'true' &&
      contains(fromJSON(needs.release-please.outputs.paths_released || '[]'), 'packages/rome-node-cli')
    # Both publishers live in the reusable workflow. Each job narrows its own token.
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/rome-node.yml
    with:
      publish_image: true
      tag_release: true

  publish-macos-helper:
    name: Publish macOS Computer Use Helper
    needs: release-please
    if: >-
      github.event_name == 'push' &&
      needs.release-please.outputs.releases_created == 'true' &&
      contains(fromJSON(needs.release-please.outputs.paths_released || '[]'), 'packages/rome-node-core')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/rome-node.yml
    with:
      publish_macos_helper: true
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_P8_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENT }}

  publish-manual:
    name: Publish manual package
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/sdk-publish.yml
    with:
      package: ${{ inputs.package }}
      dry_run: ${{ inputs.dry_run }}

  publish-rome-node-image-manual:
    name: Publish manual Rome Node image
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.package == 'all' || inputs.package == 'packages/rome-node-cli')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/rome-node.yml
    with:
      publish_image: ${{ !inputs.dry_run }}
      tag_release: ${{ !inputs.dry_run }}

  publish-macos-helper-manual:
    name: Publish manual macOS Computer Use Helper
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.package == 'all' || inputs.package == 'packages/rome-node-core')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/rome-node.yml
    with:
      publish_macos_helper: true
      dry_run: ${{ inputs.dry_run }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_P8_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENT }}
