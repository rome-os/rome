name: Mobile CI

# Validates the packages/mobile Expo shell on every change to it. The package
# is a regular member of the root pnpm workspace (single lockfile); this job
# exists for the Expo-specific validation the repo's main CI doesn't run —
# expo-doctor and the Metro bundle smoke test. (Root CI's `pnpm -r typecheck`
# already covers typecheck on every PR; it is repeated here only so this
# path-filtered job stays a self-contained signal.)

on:
  pull_request:
    paths:
      - "packages/mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/actions/setup-ci/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "scripts/ci-env.sh"
      # Workspace member: the root lockfile and workspace config (overrides,
      # peer rules) control mobile's entire resolved dependency graph — a
      # root-level bump can break Metro/Expo without touching packages/mobile.
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - "packages/mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/actions/setup-ci/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "scripts/ci-env.sh"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  check:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      # Actions pinned to immutable commit SHAs, matching the other workflows.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-ci
        with:
          pnpm-store-cache: read-write

      # Workspace member: install resolves against the ROOT lockfile.
      - name: Install dependencies
        working-directory: .
        run: '"$GITHUB_WORKSPACE/scripts/ci-env.sh" pnpm install --frozen-lockfile'

      - name: Typecheck
        run: '"$GITHUB_WORKSPACE/scripts/ci-env.sh" pnpm typecheck'

      - name: Test
        run: '"$GITHUB_WORKSPACE/scripts/ci-env.sh" pnpm test'

      # 20 of expo-doctor's 21 checks are a pure function of the checked-out
      # tree. The 21st — "packages match versions required by installed Expo
      # SDK" — resolves its expected versions from api.expo.dev at run time
      # rather than from the installed expo package's bundledNativeModules.json,
      # so it fails whenever Expo publishes an SDK 57 patch, against an
      # unchanged repo and a frozen lockfile. It is a semver-range check rather
      # than a compatibility test: the major/minor/patch bucketing only picks a
      # heading, so patch drift blocks a PR as hard as a major mismatch does.
      # Skipping it keeps this job a function of the commit under test. To
      # check dependency freshness deliberately, run `pnpm dlx expo-doctor` in
      # packages/mobile with the variable unset.
      # See https://expo.fyi/dependency-validation.
      - name: Expo doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
        run: '"$GITHUB_WORKSPACE/scripts/ci-env.sh" pnpm dlx expo-doctor'

      # Smoke-test the real Metro/Expo bundle path. This catches resolver, Babel,
      # and asset regressions that typecheck and unit tests cannot — the one
      # mobile-specific validation that otherwise stays manual. No device needed.
      # EXPO_PUBLIC_* vars are inlined at bundle time (config.ts validates them
      # at runtime, which a bundle never executes), so none need to be set here.
      - name: Expo export (bundle smoke test)
        run: '"$GITHUB_WORKSPACE/scripts/ci-env.sh" pnpm exec expo export --platform ios'
