name: Rome Node package

# The unit suites of the packages run in ci.yml. This workflow checks the
# standalone npm archives, the Web UI bundle budget, native helper, and Docker image.
# release.yml calls it to publish the Node image and the signed Computer Use
# Helper when their respective npm packages release.
on:
  pull_request:
    paths:
      - infra/rome-node/**
      - packages/rome-node-cli/**
      - packages/rome-node-core/**
      - packages/rome-node-ui/**
      - packages/rome-node-web/**
      - packages/ui/**
      - packages/web/src/lib/theme.ts
      - packages/web/src/lib/themes.ts
      - packages/web/src/lib/stored-preference.ts
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - tsconfig.json
      - .github/workflows/rome-node.yml
  push:
    branches: [main]
    paths:
      - infra/rome-node/**
      - packages/rome-node-cli/**
      - packages/rome-node-core/**
      - packages/rome-node-ui/**
      - packages/rome-node-web/**
      - packages/ui/**
      - packages/web/src/lib/theme.ts
      - packages/web/src/lib/themes.ts
      - packages/web/src/lib/stored-preference.ts
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - tsconfig.json
      - .github/workflows/rome-node.yml
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the Docker image to GitHub Container Registry
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish_image:
        description: Publish the Docker image to GitHub Container Registry
        required: false
        type: boolean
        default: false
      tag_release:
        description: Also tag the image as the immutable semver version from packages/rome-node-cli/package.json and latest (for stable releases)
        required: false
        type: boolean
        default: false
      publish_macos_helper:
        description: Build the signed Computer Use Helper for the Node Core release
        type: boolean
        default: false
      dry_run:
        description: Build and verify the signed Helper without uploading release assets
        type: boolean
        default: false
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_P8_CONTENT:
        required: false

permissions:
  contents: read

jobs:
  macos-native:
    if: ${{ !inputs.publish_macos_helper }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Compile and test the native helper without signing
        run: |
          set -euo pipefail
          script=packages/rome-node-core/scripts/computer-use.swift
          app="$RUNNER_TEMP/rome-native/Rome Computer Use.app"
          swift "$script" build --self-test-build --app "$app"
          swift "$script" test --app "$app"
          if output=$(swift "$script" verify --release --app "$app" 2>&1); then
            echo "::error::The release verifier accepted the compile-only helper."
            exit 1
          fi
          printf '%s\n' "$output"
          [[ "$output" == "A compile-only helper cannot be released or installed." ]]
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @rome-os/node-core...
      - run: pnpm --filter @rome-os/node-core test src/computer-use/install.test.ts

  package:
    if: ${{ !inputs.publish_macos_helper }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @rome-os/node... --filter @rome-os/node-web...
      - run: pnpm --filter @rome-os/ui build
      - run: pnpm --filter @rome-os/node-ui build
      - run: pnpm --filter @rome-os/node build
      - run: pnpm --filter @rome-os/node-web build
      - run: pnpm --filter @rome-os/node-web test
      - run: node packages/rome-node-cli/bin/rome-node.js --help
      - name: Install the standalone archive
        run: |
          mkdir -p "$RUNNER_TEMP/rome-node-package"
          pnpm --filter @rome-os/node-core pack --pack-destination "$RUNNER_TEMP/rome-node-package"
          pnpm --filter @rome-os/node pack --pack-destination "$RUNNER_TEMP/rome-node-package"
          npm install --prefix "$RUNNER_TEMP/rome-node-core-install" "$RUNNER_TEMP"/rome-node-package/rome-os-node-core-*.tgz
          node packages/rome-node-cli/scripts/package-smoke.mjs "$RUNNER_TEMP/rome-node-core-install"
          npm install --prefix "$RUNNER_TEMP/rome-node-install" "$RUNNER_TEMP"/rome-node-package/*.tgz
          node "$RUNNER_TEMP/rome-node-install/node_modules/@rome-os/node/bin/rome-node.js" --help

  image:
    if: ${{ !inputs.publish_macos_helper }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Build the standalone image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: docker buildx build --platform "$PLATFORM" --file infra/rome-node/Dockerfile --tag rome-node:ci --load .
      - name: Cross-build the arm64 image on amd64
        if: matrix.platform == 'linux/amd64'
        run: docker buildx build --platform linux/arm64 --file infra/rome-node/Dockerfile --output type=cacheonly .
      - name: Run CLI, Web UI, and audit checks as an unprivileged user
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true rome-node:ci --help
          docker run --rm --network none --read-only --cap-drop ALL \
            --volume /var/lib/rome-node \
            --security-opt no-new-privileges:true --entrypoint sh rome-node:ci -ec '
              test "$(id -u)" -ne 0
              rome-node --help >/dev/null
              node --input-type=module -e '\''
                import { AuditStore, connectHost } from "/app/node_modules/@rome-os/node-core/dist/host.js";
                const audit = await AuditStore.open({ path: "/var/lib/rome-node/audit/audit.db", entry: "cli", hint: "" });
                if (audit.state.state !== "ok" || typeof connectHost !== "function") process.exit(1);
                audit.close();
              '\''
              rome-node audit status
              ROME_NODE_UI_PASSWORD=ci-smoke-password rome-node web --host 0.0.0.0 --port 4310 >/dev/null 2>&1 &
              WEB_PID=$!
              trap "kill $WEB_PID 2>/dev/null || true" EXIT
              node --input-type=module -e '\''
                const base = "http://127.0.0.1:4310";
                let healthy = false;
                for (let i = 0; i < 40; i++) {
                  try {
                    const res = await fetch(`${base}/healthz`);
                    if (res.status === 200) { healthy = true; break; }
                  } catch {}
                  await new Promise((r) => setTimeout(r, 100));
                }
                if (!healthy) throw new Error("web UI did not become healthy");
                const indexRes = await fetch(`${base}/`, { headers: { "accept-encoding": "gzip" } });
                if (indexRes.status !== 200) throw new Error(`GET / returned ${indexRes.status}`);
                const html = await indexRes.text();
                if (!html.includes("id=\"root\"")) throw new Error("missing SPA root");
                const unauth = await fetch(`${base}/api/status`);
                if (unauth.status !== 401) throw new Error(`expected 401 unauthenticated, got ${unauth.status}`);
                const unauthAudit = await fetch(`${base}/api/audit/summary`);
                if (unauthAudit.status !== 401) throw new Error(`expected 401 unauthenticated /api/audit/summary, got ${unauthAudit.status}`);
                const login = await fetch(`${base}/api/auth/login`, {
                  method: "POST",
                  headers: { "content-type": "application/json", origin: base },
                  body: JSON.stringify({ password: "ci-smoke-password" }),
                });
                if (login.status !== 200) throw new Error(`login failed: ${login.status}`);
                const cookie = (login.headers.get("set-cookie") ?? "").split(";")[0];
                const statusRes = await fetch(`${base}/api/status`, { headers: { cookie } });
                if (statusRes.status !== 200) throw new Error(`authenticated /api/status failed: ${statusRes.status}`);
                const snap = await statusRes.json();
                if (snap.phase !== "unconfigured" || snap.audit?.status?.state !== "ok") {
                  throw new Error(`unexpected status snapshot: ${JSON.stringify(snap)}`);
                }
                const auditSummaryRes = await fetch(`${base}/api/audit/summary`, { headers: { cookie } });
                if (auditSummaryRes.status !== 200) throw new Error(`authenticated /api/audit/summary failed: ${auditSummaryRes.status}`);
                const auditSummary = await auditSummaryRes.json();
                if (auditSummary.status?.state !== "ok" || "path" in auditSummary) {
                  throw new Error(`unexpected audit summary: ${JSON.stringify(auditSummary)}`);
                }
                const auditItemsRes = await fetch(`${base}/api/audit/items?limit=10`, { headers: { cookie } });
                if (auditItemsRes.status !== 200) throw new Error(`authenticated /api/audit/items failed: ${auditItemsRes.status}`);
                const auditItems = await auditItemsRes.json();
                if (!Array.isArray(auditItems.items)) {
                  throw new Error(`unexpected audit items: ${JSON.stringify(auditItems)}`);
                }
              '\''
              kill "$WEB_PID" 2>/dev/null || true
              wait "$WEB_PID" 2>/dev/null || true
              rome-node web --host 0.0.0.0 --port 4311 >/dev/null 2>&1 &
              SETUP_PID=$!
              trap "kill $SETUP_PID 2>/dev/null || true" EXIT
              node --input-type=module -e '\''
                const base = "http://127.0.0.1:4311";
                let healthy = false;
                for (let i = 0; i < 40; i++) {
                  try {
                    const res = await fetch(`${base}/healthz`);
                    if (res.status === 200) { healthy = true; break; }
                  } catch {}
                  await new Promise((r) => setTimeout(r, 100));
                }
                if (!healthy) throw new Error("setup-mode web UI did not become healthy");
                const sessionRes = await fetch(`${base}/api/auth/session`);
                const session = await sessionRes.json();
                if (!session.authRequired || session.passwordSource !== "setup" || session.canRemovePassword) {
                  throw new Error(`unexpected setup session: ${JSON.stringify(session)}`);
                }
                const forged = await fetch(`${base}/api/status`, {
                  headers: { "sec-fetch-site": "same-origin" },
                });
                if (forged.status !== 401) throw new Error(`expected 401 on 0.0.0.0 setup mode, got ${forged.status}`);
              '\''
            '

  publish-image:
    if: >-
      github.repository == 'rome-os/rome' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_image
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rome-node-image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-platform image
        env:
          TAG_RELEASE: ${{ inputs.tag_release || false }}
        run: |
          set -euo pipefail
          repo="ghcr.io/rome-os/rome-node"
          tags=("${repo}:${GITHUB_SHA}")
          labels=(
            "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            "org.opencontainers.image.revision=${GITHUB_SHA}"
          )

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?$'
          stable_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$TAG_RELEASE" == "true" ]]; then
            version=$(jq -er '.version' packages/rome-node-cli/package.json)
            if [[ ! "$version" =~ $semver ]]; then
              echo "::error::Version '${version}' in packages/rome-node-cli/package.json is not strict semver; refusing to publish."
              exit 1
            fi

            # Enforce semver tag immutability: refuse to overwrite an already-published
            # version tag (e.g. a manual release.yml dispatch after newer commits landed
            # on main). "Not found" is the only proceed path; fail closed on registry errors.
            ref="${repo}:${version}"
            if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
              echo "::error::${ref} already exists; semver tags are immutable — cut a new version."
              exit 1
            elif ! grep -qiE 'not found|manifest unknown|no such manifest|name unknown' <<< "$out"; then
              echo "::error::Could not verify ${ref} is unpublished: ${out}"
              exit 1
            fi

            tags+=("$ref")
            labels+=("org.opencontainers.image.version=${version}")
            if [[ "$version" =~ $stable_semver ]]; then
              tags+=("${repo}:latest")
            else
              echo "Skipping :latest tag for prerelease version '${version}'."
            fi
          fi

          build_args=(
            --platform linux/amd64,linux/arm64
            --file infra/rome-node/Dockerfile
            --metadata-file "$RUNNER_TEMP/rome-node-build.json"
          )
          for label in "${labels[@]}"; do
            build_args+=(--label "$label")
          done
          for tag in "${tags[@]}"; do
            build_args+=(--tag "$tag")
          done

          docker buildx build "${build_args[@]}" --push .

          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/rome-node-build.json")
          {
            printf 'Published `%s@%s`\n\n' "$repo" "$digest"
            printf 'Tags:\n'
            for tag in "${tags[@]}"; do
              printf -- '- `%s`\n' "$tag"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  publish-macos-helper:
    if: >-
      github.repository == 'rome-os/rome' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_macos_helper
    runs-on: macos-15
    timeout-minutes: 35
    concurrency:
      group: rome-node-macos-helper-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      ARCHIVE: Rome-Computer-Use-darwin-arm64.zip
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Select the Node Core release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          version=$(jq -er '.version | strings' packages/rome-node-core/package.json)
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          [[ "$version" =~ $semver ]]
          tag="node-core-v${version}"
          if [[ "$DRY_RUN" != true ]]; then
            gh release view "$tag" --json tagName,isDraft,isImmutable | jq -e --arg tag "$tag" \
              '.tagName == $tag and .isDraft == false and .isImmutable == false' >/dev/null
            git fetch --no-tags origin "refs/tags/$tag"
            git switch --detach FETCH_HEAD
            [[ "$(jq -er '.version' packages/rome-node-core/package.json)" == "$version" ]]
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Import the Rome Developer ID signing identity
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing CSC_LINK}" "${CSC_KEY_PASSWORD:?Missing CSC_KEY_PASSWORD}"
          umask 077
          keychain="$RUNNER_TEMP/rome-computer-use.keychain-db"
          cert="$RUNNER_TEMP/rome-computer-use.p12"
          case "$CSC_LINK" in
            file://*) cert="${CSC_LINK#file://}" ;;
            /*) cert="$CSC_LINK" ;;
            *) printf '%s' "$CSC_LINK" | base64 --decode > "$cert" ;;
          esac
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$(security default-keychain -d user | xargs)"
          security import "$cert" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          signing_identity=$(security find-identity -v -p codesigning "$keychain" | awk '
            /"Developer ID Application: .+ \(4YWXB26F39\)"$/ { identity = $2; count++ }
            END { if (count == 1) print identity }
          ')
          if ! [[ "$signing_identity" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::Expected one valid Rome Developer ID Application signing identity."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Sign, notarize, and package the Helper
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_P8_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENT }}
        run: |
          set -euo pipefail
          : "${APP_STORE_CONNECT_KEY_ID:?Missing App Store Connect key ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing App Store Connect issuer ID}"
          : "${APP_STORE_CONNECT_P8_CONTENT:?Missing App Store Connect private key}"
          umask 077
          key_path="$RUNNER_TEMP/rome-computer-use.p8"
          printf '%s' "$APP_STORE_CONNECT_P8_CONTENT" | perl -pe 's/\\n/\n/g' > "$key_path"
          chmod 600 "$key_path"

          script=packages/rome-node-core/scripts/computer-use.swift
          app="$RUNNER_TEMP/rome-computer-use/Rome Computer Use.app"
          notary_zip="$RUNNER_TEMP/rome-computer-use-notary.zip"
          dist="$RUNNER_TEMP/rome-computer-use-dist"
          mkdir "$dist"
          swift "$script" build --identity "$SIGNING_IDENTITY" --app "$app"
          /usr/bin/ditto -c -k --keepParent "$app" "$notary_zip"
          xcrun notarytool submit "$notary_zip" --key "$key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait --timeout 20m
          xcrun stapler staple "$app"
          swift "$script" verify --release --app "$app"
          spctl --assess --type execute --verbose "$app"
          /usr/bin/ditto -c -k --keepParent "$app" "$dist/$ARCHIVE"
          /usr/bin/ditto -x -k "$dist/$ARCHIVE" "$RUNNER_TEMP/rome-computer-use-verify"
          swift "$script" verify --release --app "$RUNNER_TEMP/rome-computer-use-verify/Rome Computer Use.app"
          cd "$dist"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Delete the temporary keychain and credentials
        if: always()
        run: |
          status=0
          keychain="$RUNNER_TEMP/rome-computer-use.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain" || status=1; fi
          for file in "$RUNNER_TEMP/rome-computer-use.p12" "$RUNNER_TEMP/rome-computer-use.p8"; do
            if [[ -f "$file" ]]; then unlink "$file" || status=1; fi
          done
          exit "$status"

      - name: Publish the versioned Helper assets
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if grep -Fxq -e "$ARCHIVE" -e "$ARCHIVE.sha256" <<< "$assets"; then
            echo "::error::A Helper asset already exists on $RELEASE_TAG. Cut a new version to publish again."
            exit 1
          fi
          cd "$RUNNER_TEMP/rome-computer-use-dist"
          gh release upload "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" --repo "$GITHUB_REPOSITORY"
