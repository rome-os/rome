name: Rome Node platforms

on:
  pull_request:
    paths:
      - packages/rome-node/**
      - pnpm-lock.yaml
      - .github/workflows/rome-node.yml
  push:
    branches: [main]
    paths:
      - packages/rome-node/**
      - pnpm-lock.yaml
      - .github/workflows/rome-node.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @rome-os/node
      - run: pnpm --filter @rome-os/node build
      - run: pnpm --filter @rome-os/node exec rstest
      - run: node packages/rome-node/bin/rome-node.js --help
      - name: Install the standalone archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rome-node-package"
          pnpm --filter @rome-os/node pack --pack-destination "$RUNNER_TEMP/rome-node-package"
          npm install --prefix "$RUNNER_TEMP/rome-node-install" "$RUNNER_TEMP"/rome-node-package/*.tgz
          node "$RUNNER_TEMP/rome-node-install/node_modules/@rome-os/node/bin/rome-node.js" --help
