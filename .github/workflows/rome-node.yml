name: Rome Node package

# The unit suites of both packages run in ci.yml. This workflow checks the
# standalone npm archives and the Docker image. A manual run can publish the image.
on:
  pull_request:
    paths:
      - infra/rome-node/**
      - packages/rome-node-cli/**
      - packages/rome-node-core/**
      - packages/web/src/lib/rome-node-image.json
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - tsconfig.json
      - .github/workflows/rome-node.yml
  push:
    branches: [main]
    paths:
      - infra/rome-node/**
      - packages/rome-node-cli/**
      - packages/rome-node-core/**
      - packages/web/src/lib/rome-node-image.json
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - tsconfig.json
      - .github/workflows/rome-node.yml
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the Docker image to GitHub Container Registry
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @rome-os/node...
      - run: pnpm --filter @rome-os/node build
      - run: node packages/rome-node-cli/bin/rome-node.js --help
      - name: Install the standalone archive
        run: |
          mkdir -p "$RUNNER_TEMP/rome-node-package"
          pnpm --filter @rome-os/node-core pack --pack-destination "$RUNNER_TEMP/rome-node-package"
          pnpm --filter @rome-os/node pack --pack-destination "$RUNNER_TEMP/rome-node-package"
          npm install --prefix "$RUNNER_TEMP/rome-node-core-install" "$RUNNER_TEMP"/rome-node-package/rome-os-node-core-*.tgz
          node packages/rome-node-cli/scripts/package-smoke.mjs "$RUNNER_TEMP/rome-node-core-install"
          npm install --prefix "$RUNNER_TEMP/rome-node-install" "$RUNNER_TEMP"/rome-node-package/*.tgz
          node "$RUNNER_TEMP/rome-node-install/node_modules/@rome-os/node/bin/rome-node.js" --help

  image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Build the standalone image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: docker buildx build --platform "$PLATFORM" --file infra/rome-node/Dockerfile --tag rome-node:ci --load .
      - name: Load the Node runtime
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --entrypoint node rome-node:ci
          --input-type=module -e
          'import { runLanNode } from "./dist/lan-node.js";
          if (typeof runLanNode !== "function" || process.getuid() === 0) process.exit(1)'

  publish-image:
    if: >-
      github.repository == 'rome-os/rome' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.publish_image
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: rome-node-image-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-platform image
        run: |
          image=$(jq -er .image packages/web/src/lib/rome-node-image.json)
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file infra/rome-node/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" --push .
