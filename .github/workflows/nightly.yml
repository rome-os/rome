name: Nightly

on:
  schedule:
    - cron: "0 6 * * *" # 6am UTC daily

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
        with:
          pnpm-store-cache: read-write
      - run: scripts/ci-env.sh pnpm install --frozen-lockfile
      - run: scripts/ci-env.sh pnpm test:ci

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
        with:
          pnpm-store-cache: read-write
      - run: scripts/ci-env.sh pnpm install --frozen-lockfile
      - run: scripts/ci-env.sh pnpm test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  docker-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
      - run: scripts/ci-env.sh pnpm docker:closure-check
