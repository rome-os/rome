appId: com.rome.desktop
productName: Rome
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - src/renderer/**/*
  - "!**/*.ts"
  - "!**/*.map"
  # koffi ships sources and a prebuilt binary for every platform; the app
  # needs only its loader and the macOS binaries.
  - "!**/node_modules/koffi/{doc,lib,src,vendor}/**"
  - "!**/node_modules/koffi/build/koffi/!(darwin_*)/**"
extraMetadata:
  main: dist/main/index.js
asar: true
# The only native module, better-sqlite3, ships as native/better_sqlite3.node
# (scripts/rebuild-native.mjs). Rebuilding node_modules would only recompile
# the workspace copy that Rome Core uses, which the app never loads.
npmRebuild: false
asarUnpack:
  - "native/**/*.node"
extraResources:
  - from: native/
    to: native/
    filter:
      - "*.node"
  - from: build/tray/
    to: tray/
    filter:
      - "*.png"

protocols:
  - name: Rome
    schemes:
      - rome

mac:
  publish:
    provider: generic
    url: https://updates.romeos.io/desktop/stable/darwin/arm64
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  category: public.app-category.productivity
  extendInfo:
    # Programs Rome runs on this Mac as a device count as the app's own
    # traffic, so reaching a printer or another computer on the LAN asks here.
    NSLocalNetworkUsageDescription: Rome runs programs you ask for on this Mac, and some of them reach devices on your local network.
