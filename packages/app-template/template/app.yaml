formatVersion: 2
id: __APP_ID__
name: __APP_NAME__
version: 0.1.0
description: __APP_NAME__ app
# Shown on the app's social share card. One sentence, at most 80 characters
# (40 for CJK): lead with what the user gets, no jargon — write it like an
# App Store subtitle, and update it when the app's purpose changes.
# Fill it in or delete the line; a placeholder tagline is worse than none (the card falls back to the first sentence of description).
tagline: __APP_NAME__ in one sentence
icon: assets/icon.svg
appRoot: dist
includeSource: true

web:
  manifest: web/manifest.json
  displayName: __APP_NAME__
  navLabel: __APP_NAME__

api:
  entry: api/index
  # By default every `/api/app-api/<appId>/*` route is gated by the dashboard
  # session cookie. To expose endpoints to the public internet (third-party
  # webhooks, public callbacks), opt them out of the session check below.
  # `true` opens every sub-path of this app; an array opens only the listed
  # sub-paths (a trailing `/*` makes the entry a prefix match).
  # noAuth: true
  # noAuth:
  #   - /webhooks/stripe
  #   - /public/*

# Uncomment the block below to enable a per-app SQLite database (Drizzle ORM).
# After uncommenting, run `pnpm db:generate` to produce migrations from
# src/db/schema.ts. If you don't need a DB, delete the src/db/ directory and
# drizzle.config.ts. See src/db/README.md for details.
# db:
#   migrations: db/migrations
#   tablePrefix: __APP_TABLE_PREFIX__

actions:
  - actions/hello
  # Uncomment to enable the ask-agent example, which calls the platform
  # `system:summon` action to run the demo agent and return its final result. Requires
  # the `agents:` block below so the `__APP_ID__:demo` agent is registered. The API
  # route `POST /ask` in src/api/index.ts calls this action through `runAction`.
  # - actions/ask-agent

# Uncomment the block below to register app-owned agents. Each entry points at
# a YAML file under src/agents/. The demo agent in src/agents/demo.yaml
# is a sensible template — edit its tools, model, and systemPromptPrefix to fit
# the app, then list it here. If you don't need an agent, delete the
# src/agents/ directory.
# agents:
#   - agents/demo.yaml
