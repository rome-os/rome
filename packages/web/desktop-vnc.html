<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rome Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        --rome-safe-area-bottom: env(safe-area-inset-bottom);
        --bg: #060606;
        --text: rgba(255, 255, 255, 0.92);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(circle at top, rgba(125, 211, 252, 0.12), transparent 32%),
          var(--bg);
        color: var(--text);
        font:
          14px/1.4 ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        overflow: hidden;
      }

      #app {
        position: relative;
        height: 100%;
        width: 100%;
      }

      #viewport-frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #viewport-frame.touch-mode {
        touch-action: none;
      }

      #screen-wrap {
        position: absolute;
        top: 0;
        left: 0;
        will-change: top, left, width, height;
      }

      #viewport-frame:not(.touch-mode) #screen-wrap {
        position: absolute;
        inset: 0;
      }

      #screen {
        height: 100%;
        width: 100%;
        outline: none;
      }

      #keyboard-toolbar {
        position: absolute;
        right: 12px;
        bottom: calc(12px + var(--rome-safe-area-bottom));
        z-index: 5;
        display: none;
        gap: 8px;
      }

      body.touch-mode #keyboard-toolbar {
        display: flex;
      }

      #keyboard-toolbar button {
        min-width: 44px;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(20, 20, 20, 0.78);
        color: var(--text);
        font: inherit;
        font-size: 16px;
        line-height: 1;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      #keyboard-toolbar button:active {
        background: rgba(60, 60, 60, 0.9);
      }

      #keyboard-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 1px;
        height: 1px;
        left: -9999px;
        top: -9999px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewport-frame">
        <div id="screen-wrap">
          <div id="screen" tabindex="0"></div>
        </div>
      </div>
      <div id="keyboard-toolbar">
        <button type="button" id="kb-toggle" aria-label="Show keyboard">⌨</button>
      </div>
      <input id="keyboard-input" type="text" autocapitalize="off" autocomplete="off"
        autocorrect="off" spellcheck="false" />
    </div>
  </body>
</html>
