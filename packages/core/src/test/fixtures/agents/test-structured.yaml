name: test-structured
description: Test agent that returns a provider-native structured JSON payload.
model: haiku
permissionMode: bypassPermissions
tools:
  - Read
systemPromptPrefix: |
  You are a test agent. Decide an action and return the structured result.
outputSchema:
  type: object
  required:
    - decision
    - reason
  additionalProperties: false
  properties:
    decision:
      type: string
      enum:
        - REPLY
        - ESCALATE
        - IGNORE
    reason:
      type: string
