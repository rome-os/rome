<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="20" y="100" width="160" height="90" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="100" y="135" text-anchor="middle" font-weight="bold" fill="#1f3a60">Connections</text>
  <text x="100" y="158" text-anchor="middle" font-size="12" fill="#333">what access Rome has</text>
  <text x="100" y="174" text-anchor="middle" font-size="12" fill="#333">to which external account</text>
  <rect x="200" y="20" width="160" height="90" rx="8" fill="#eef8ef" stroke="#4f8a5b" stroke-width="2"/>
  <text x="280" y="55" text-anchor="middle" font-weight="bold" fill="#234a2b">Chats</text>
  <text x="280" y="78" text-anchor="middle" font-size="12" fill="#333">who said what, where,</text>
  <text x="280" y="94" text-anchor="middle" font-size="12" fill="#333">and as whom</text>
  <rect x="380" y="100" width="160" height="90" rx="8" fill="#fbf3ea" stroke="#b07a3a" stroke-width="2"/>
  <text x="460" y="135" text-anchor="middle" font-weight="bold" fill="#5a3b14">Agents</text>
  <text x="460" y="158" text-anchor="middle" font-size="12" fill="#333">what an agent is</text>
  <text x="460" y="174" text-anchor="middle" font-size="12" fill="#333">and how it runs</text>
  <line x1="150" y1="100" x2="230" y2="70" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="70" font-size="12" fill="#444">carries messages</text>
  <line x1="410" y1="100" x2="330" y2="70" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="70" font-size="12" fill="#444">takes part</text>
  <line x1="180" y1="150" x2="380" y2="150" stroke="#444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#444">which agent speaks through this account</text>
  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#555">Chats follows the definitions of the other two and changes neither.</text>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#555">Connections and Agents do not depend on each other.</text>
</svg>
