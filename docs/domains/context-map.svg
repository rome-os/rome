<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="20" y="100" width="160" height="90" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="100" y="135" text-anchor="middle" font-weight="bold" fill="#1f3a60">Connections</text>
  <text x="100" y="158" text-anchor="middle" font-size="12" fill="#333">what access Rome has</text>
  <text x="100" y="174" text-anchor="middle" font-size="12" fill="#333">to which external account</text>
  <rect x="200" y="20" width="160" height="90" rx="8" fill="#eef8ef" stroke="#4f8a5b" stroke-width="2"/>
  <text x="280" y="55" text-anchor="middle" font-weight="bold" fill="#234a2b">Chats</text>
  <text x="280" y="78" text-anchor="middle" font-size="12" fill="#333">who said what, where,</text>
  <text x="280" y="94" text-anchor="middle" font-size="12" fill="#333">and as whom</text>
  <rect x="200" y="180" width="160" height="90" rx="8" fill="#f4eefb" stroke="#7a4fa5" stroke-width="2"/>
  <text x="280" y="215" text-anchor="middle" font-weight="bold" fill="#3c1f60">Participation</text>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#333">what wakes an agent, what it</text>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#333">reads, and where it speaks</text>
  <rect x="380" y="100" width="160" height="90" rx="8" fill="#fbf3ea" stroke="#b07a3a" stroke-width="2"/>
  <text x="460" y="135" text-anchor="middle" font-weight="bold" fill="#5a3b14">Agents</text>
  <text x="460" y="158" text-anchor="middle" font-size="12" fill="#333">what an agent is</text>
  <text x="460" y="174" text-anchor="middle" font-size="12" fill="#333">and how it runs</text>
  <line x1="150" y1="100" x2="230" y2="70" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="70" font-size="12" fill="#444">carries messages</text>
  <line x1="250" y1="180" x2="250" y2="112" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="112" x2="310" y2="178" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="130" font-size="12" fill="#444" text-anchor="end">reads</text>
  <text x="365" y="165" font-size="12" fill="#444">speaks</text>
  <line x1="360" y1="225" x2="440" y2="192" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="235" font-size="12" fill="#444">starts a turn</text>
  <line x1="180" y1="145" x2="380" y2="145" stroke="#444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#444">which agent speaks through this account</text>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#555">Chats follows the definitions of Connections and Agents and changes neither.</text>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#555">Participation depends on Chats and Agents. Connections and Agents do not depend on each other.</text>
</svg>
