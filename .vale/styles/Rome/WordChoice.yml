# The house word list, from the "Word choice" section of
# docs/authoring/WRITING.md. Every pair here is a choice this repo has made, so
# this rule is an error. Rome.PlainLanguage holds the wider advisory list.
#
# Each key matches the ordinary inflections, gerund included: a rule that reads
# "ensure" and misses "ensuring" gates half the prose that uses the word. The
# replacement stays in base form — the message names the word to reach for, not
# the exact string to paste.
#
# WRITING.md also prefers "start" over "begin" and "initiate", and "get" over
# "acquire". Those three are absent here on purpose: each has a technical sense
# this rule cannot tell apart from the prose one. "Begins" is a plural noun in
# "ends FIFO with unmatched begins", "acquire" is a noun in "on every acquire",
# and "initiated" is half of a compound adjective in "backend-initiated". A
# reader still applies the WRITING.md preference. The gate does not, because it
# would be wrong more often than right.
extends: substitution
message: "Use '%s', not '%s'."
level: error
ignorecase: true
swap:
  'commenc(?:e|es|ed|ing)': start
  'utili[sz](?:e|es|ed|ing)': use
  'utili[sz]ation': use
  'leverag(?:e|es|ed|ing)': use
  'facilitat(?:e|es|ed|ing)': help
  'ensur(?:e|es|ed|ing)': make sure
  'prior to': before
  'obtain(?:s|ed|ing)?': get
  'demonstrat(?:e|es|ed|ing)': show
  'additionally': also
  'furthermore': also
  'moreover': also
