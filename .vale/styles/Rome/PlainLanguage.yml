# The plain-word lookup table: a fancy word on the left, the simpler word to
# reach for on the right. This is the list to consult when picking a word, and
# the reason it is checked in rather than kept as a habit.
#
# Source: the "Simple words and phrases" list published by plainlanguage.gov
# (public domain), by way of the retext-simplify pattern table. Curated for this
# repo, dropping three groups:
#
#   - terms that mean something else in software, where the plain swap is wrong
#     ("interface" is not "meet", "parameters" are not "limits", "delete" is not
#     "cut")
#   - entries whose replacement is itself a contraction, which
#     Rome.Contractions forbids
#   - entries that only ever applied to government and military memos
#
# Pairs the repo has decided on live in Rome.WordChoice at error level. This
# list is a suggestion: it advises, it does not gate. Adding a pair here is
# cheap and does not break a build, so add one whenever a fancier word gets
# past review.
extends: substitution
message: "Consider '%s' instead of '%s'."
level: suggestion
ignorecase: true
