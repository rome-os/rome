<!doctype html>
<html lang="en">
  <head><title>Select Flights | Southwest Airlines</title></head>
  <body>
    <div class="air-booking-select-price-matrix">
      <div class="price-matrix--airport-codes">OAKHOU</div>
      <div class="calendar-strip"><button aria-current="true" itemday="0">Nov 13</button></div>
      <div class="air-booking-select-price-heading-options">
        <button data-test="currency-options-toggle-item--usd">$</button>
        <button data-test="currency-options-toggle-item--points" class="swa-g-selected">Points</button>
        <span>Government taxes &amp; fees included</span>
      </div>
      <div>No flights available. Select an alternate date.</div>
    </div>
    <ul class="search-results--terms">
      <li>All fares and fare ranges are subject to change until purchased and are per person for each way of travel.</li>
    </ul>
  </body>
</html>
