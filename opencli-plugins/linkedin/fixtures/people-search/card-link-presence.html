<!doctype html>
<!-- Each result is one link wrapping the whole card, with no aria-hidden name. The photo and its
     presence text render inside the link before the name, so the link's first line is not a name. -->
<html lang="en">
<body>
<main>
  <div role="list">
    <div role="listitem">
      <a href="https://www.linkedin.com/in/morgan-sample/">
        <div><img alt=""><span>Status is online</span></div>
        <div>Morgan Sample</div>
        <div>2nd</div>
        <div>Pharmacist at Example Clinic</div>
        <div>Porto, Portugal</div>
      </a>
      <button>Message</button>
    </div>
    <div role="listitem">
      <a href="https://www.linkedin.com/in/taylor-fixture/">
        <div><img alt=""><span>Status is away</span></div>
        <div>Taylor Fixture • 3rd+</div>
        <div>Librarian at Example Library</div>
      </a>
      <button>Connect</button>
    </div>
  </div>
</main>
</body>
</html>
