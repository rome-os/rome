<!doctype html>
<!-- Mutual-connection rows are flex rows, so each link in them is a block-level flex item on a line
     of its own. The first result shows no headline or location. In the second result, the rest of
     the sentence is a flex item of its own too. -->
<html lang="en">
<body>
<main>
  <ul role="list">
    <li>
      <a href="https://www.linkedin.com/in/avery-example/"><img alt=""></a>
      <div>
        <p><a href="https://www.linkedin.com/in/avery-example/"><span aria-hidden="true">Avery Example</span></a> <span>• 2nd</span></p>
        <p style="display: flex"><a href="https://www.linkedin.com/in/morgan-mutual/">Morgan Mutual</a> is a mutual connection</p>
      </div>
    </li>
    <li>
      <a href="https://www.linkedin.com/in/blake-example/"><img alt=""></a>
      <div>
        <p><a href="https://www.linkedin.com/in/blake-example/"><span aria-hidden="true">Blake Example</span></a> <span>• 3rd+</span></p>
        <p>Product Manager at Example Labs</p>
        <p>Seattle, Washington, United States</p>
        <p style="display: flex"><a href="https://www.linkedin.com/in/robin-mutual/"><img alt=""></a><a href="https://www.linkedin.com/in/robin-mutual/">Robin Mutual</a><span>and 2 other mutual connections</span></p>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
