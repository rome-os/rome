display_information:
  name: Rome
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Rome
    always_online: true
oauth_config:
  redirect_urls:
    # Replace with the Rome Cloud OAuth broker's Slack callback URL.
    - https://romeos.cc/oauth/slack/callback
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
settings:
  event_subscriptions:
    # Replace with the public origin of the Rome instance using this Slack app.
    request_url: https://YOUR-ROME-INSTANCE.example/api/slack/events
    bot_events:
      - app_mention
      - app_uninstalled
      - message.im
      - tokens_revoked
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
