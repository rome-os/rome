cases:
  - name: SHELL-02 Search global chat history
    tags:
      - shell
    steps:
      - app.open:
          path: /chat
      - aiAct: >-
          Press the global search keyboard shortcut (Command+K on macOS or Control+K elsewhere)
          to open "Search chats and messages". Do not type a query yet.
      - aiAct: >-
          Type "market recap" into the open "Search chats and messages" field, then stop as soon as
          the query is visible in the field.
      - aiAssert: >-
          A global search dialog is open with "market recap" in its search field and shows at least
          one relevant chat or message result about the market recap.
  - name: SHELL-03 Open the mobile navigation drawer
    tags:
      - shell
      - mobile
    steps:
      - app.open:
          path: /chat
          viewport: mobile
      - aiAct: >-
          Click the "Open sidebar" hamburger button (three horizontal lines) in the top-left
          header once, not the back arrow beside it, then stop.
      - aiAssert: >-
          A mobile navigation drawer has slid in from the left over a dimmed page, and lists named
          Chat, Apps, and Activity entries.
