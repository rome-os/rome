cases:
  - name: SET-01 Open the appearance-mode choices
    tags:
      - settings
    steps:
      - app.open:
          path: /settings/appearance
      - aiAct: >-
          Click the visible "Appearance mode" select once, then stop with its choices open.
      - aiAssert: >-
          The Appearance mode menu is open and offers System, Light, and Dark choices.
  - name: SET-02 Open connection details
    tags:
      - settings
    steps:
      - app.open:
          path: /settings/connections
      - aiAct: >-
          Under the "Connected" heading, click the visible Telegram card once. Stop as soon as its
          connection-detail dialog is open; do not look for an "Open Telegram" button.
      - aiAssert: >-
          A Telegram connection detail dialog is open and shows its connected status and account
          information rather than an error.
  - name: SET-03 Inspect channel activation settings
    tags:
      - settings
    steps:
      - app.open:
          path: /settings/channels
      - aiAct: >-
          Click the visible "Rome / can you see active chats?" chat card once, then stop.
      - aiAssert: >-
          The card's configuration sections are shown, including an "Activation" section ("Rome in
          this chat"), a "Respond" policy set to "Only when mentioned", and "Reply
          placement" options ("Native thread", "Inline").
  - name: SET-04 Open advanced developer settings
    tags:
      - settings
    steps:
      - app.open:
          path: /settings/advanced
      - aiAct: >-
          Scroll through Advanced settings until the "Developer settings" heading is near the top
          of the screen, and stop. Do not click anything.
      - aiAssert: >-
          The "Developer settings" section shows the "Model selector", "Impersonation", and "AI
          tool usage" switches below its heading, with no control to expand it.
      # Model ID mappings sits below the switches and the page is taller than one
      # screen, so it is checked in a separate screenshot.
      - aiAct: >-
          Scroll farther down until the "Model ID mappings" heading is visible, and stop.
      - aiAssert: >-
          The "Model ID mappings" section is visible below Developer settings, with model ID fields
          and a "Save mappings" button.
