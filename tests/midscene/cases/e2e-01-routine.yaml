cases:
  - name: E2E-01 Enable a proposed routine from Chat
    tags:
      - poc
      - story
      - routines
    steps:
      - app.open:
          path: /chat/mock-chat-3
      - aiAct: >-
          Enable the visible routine proposal by clicking its orange "Turn it on" button once.
          Stop immediately after the click.
      - aiAssert: >-
          The routine proposal is now a single row: its sentence, a small green dot with "On",
          and a "⋯" menu button. There is no "Turn it on" button anymore.
