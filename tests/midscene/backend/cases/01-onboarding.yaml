cases:
  - name: ONBOARD-01 Finish first-run onboarding with a connected model
    tags:
      - onboarding
    steps:
      - app.open:
          path: /
          session: none
          waitUntil: onboard
      - aiAct: >-
          Create the local account. Enter "${guardianUser}" in the Username field and
          "${guardianPassword}" in the Password field, then click Continue. Finish when the chat
          home with its message composer is visible.
      - aiAssert: >-
          The chat home is visible with a message composer, and no error message is visible.
      - backend.connectModel: {}
