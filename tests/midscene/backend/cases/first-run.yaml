cases:
  - name: BE-01 Finish first-run onboarding with a connected model
    tags:
      - backend
    steps:
      - app.open:
          path: /
          session: none
          waitUntil: onboard
      - aiAct: >-
          Create the local account. Enter "${guardianUser}" in the Username field and
          "${guardianPassword}" in the Password field, then click Continue. Finish when a welcome
          page with a "Start chat" button is visible.
      - aiAssert: The welcome page is visible and shows a "Start chat" button.
      - backend.connectModel: {}
      - aiAct: >-
          Click "Start chat". Wait until the chat shows a greeting and a card with a "Looks good"
          button, then click "Looks good". Finish when the card is confirmed and the chat moves
          on to connecting an AI.
      - aiWaitFor:
          prompt: >-
            The chat shows "Connected an AI" (or "AI connected") and below it a question card
            asking "Which of these sounds most like your week?".
          options:
            timeoutMs: 60000
      - aiAct: >-
          In the question card, choose "Twelve tabs open, none of them read", then click the
          card's own Send button (not the message composer at the bottom). Finish when the
          answer is submitted.
      - aiWaitFor:
          prompt: >-
            Below the answered question, the chat shows either a "What I took away" summary, a
            card titled "Add scouts to your briefing", or a card titled "Pick your first app to
            build". No "Something went wrong" message is visible.
          options:
            timeoutMs: 300000
            checkIntervalMs: 10000
      - aiAct: >-
          If a card titled "Add scouts to your briefing" is waiting for an answer, click its
          "Skip for now" button. Then wait until a card titled "Pick your first app to build"
          appears and click "I'll explore on my own". Finish after that click.
      - aiAssert: >-
          The welcome conversation has handed off to a new, empty chat: the page greets
          "${guardianUser}" above an empty message composer, and no error message is visible.

  - name: BE-02 Write a project file and have Rome read it back
    tags:
      - backend
    steps:
      - app.open:
          path: /projects
      - aiAct: >-
          In the project tree, create a new file named "e2e-check.md" inside the "default"
          project. Type exactly "E2E token: ${fileToken}" as its content and save the file.
          Finish when the editor shows the file as saved.
      - aiAssert: >-
          The file "e2e-check.md" is open, its content reads "E2E token: ${fileToken}", and no
          "Failed to save" message is visible.
      - backend.expectProjectFile:
          path: projects/default/e2e-check.md
          contains: ${fileToken}
      - aiAct: >-
          Reload the page with the browser. Then open "e2e-check.md" in the "default" project
          again. Finish when its content is visible.
      - aiAssert: >-
          The open file "e2e-check.md" still reads "E2E token: ${fileToken}".
      - aiAct: >-
          Open Chat from the sidebar and start a new chat. In the message composer, type
          "Read the file projects/default/e2e-check.md and reply with only the token it
          contains." and send it.
      - aiWaitFor:
          prompt: >-
            Rome's reply has finished (no stop button or typing indicator) and the reply text
            contains "${fileToken}". No "Failed to send message" or other error is visible.
          options:
            timeoutMs: 300000
            checkIntervalMs: 10000
      - aiAssert: Rome's latest reply contains "${fileToken}" and no error message is visible.
