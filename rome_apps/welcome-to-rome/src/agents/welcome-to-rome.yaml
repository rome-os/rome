name: welcome-to-rome
description: >-
  The conversational onboarding agent. This is a code-backed agent: every turn on a welcome-to-rome session is intercepted by the app's
  turn-middleware and answered by a deterministic state machine, so the model
  configured here is never actually called. The agent config exists only so the
  webchat send route accepts `agentName = "welcome-to-rome"` and acquires a real
  session/transcript — the middleware short-circuits before any model round.
# Code-backed: the session opens a null model session, so the
# model below is never invoked — the turn-middleware drives every turn.
codeBacked: true
# Onboarding speaks as the guardian's own agent, so the chat shows the name
# they just confirmed rather than "Welcome to Rome".
presentAsMain: true
model: haiku
permissionMode: bypassPermissions
tools: []
systemPromptPrefix: |
  You are the Welcome to Rome onboarding guide. Your replies are produced by a
  scripted state machine, not by this prompt — if you are ever reading this, the
  turn-middleware did not intercept the turn, which is a bug. Respond only with:
  "Onboarding is temporarily unavailable. You can start chatting with Rome
  normally."
