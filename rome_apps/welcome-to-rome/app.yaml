formatVersion: 1
id: welcome-to-rome
name: Welcome to Rome
icon: assets/icon.svg
version: 0.1.0
description: Conversational first-run onboarding. The guardian chats with Rome in the standard Chat UI; a turn-middleware state machine confirms the names, connects an AI, asks one question, and hands off to a first chat, rendering the app's own inline cards and handing the heavy steps to specialist agents.
appRoot: dist

web:
  manifest: web/manifest.json
  displayName: Welcome to Rome

# The landing screen (src/web/App.tsx) calls POST /reset before starting a chat
# so every entry from the welcome screen replays the flow from a clean slate.
api:
  entry: api/index

# Inline chat components this app registers (via defineComponent) and renders
# into the transcript. Core validates an emitted componentId against this list.
components:
  - name-card
  - scout-suggestions
  - idea-picker

db:
  migrations: db/migrations
  tablePrefix: welcome_to_rome

agents:
  - agents/welcome-to-rome.yaml
  - agents/welcome-memory.yaml
  - agents/welcome-app-ideas.yaml

hooks:
  - hooks/turn-middleware
