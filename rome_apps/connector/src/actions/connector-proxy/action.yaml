name: connector_proxy
type: custom
description: |
  Proxy a raw HTTP request to a connected toolkit's native provider API and
  return the response. Connector holds the connection's credential and injects it
  into the outbound call, so you write against the provider's own REST/GraphQL
  surface (e.g. https://api.linear.app/graphql, https://slack.com/api/...) — the
  full API, without ever handling the token.

  Shaped like a common HTTP client: pass the owning toolkit slug, the relative
  `path` (beginning with `/`, e.g. `/graphql`, `/api/chat.postMessage`), the HTTP
  method, and optionally `body` (JSON), `query` (an object of query-string params,
  { name: value }), and `headers` ({ name: value }). Rome prepends the toolkit's
  API host, so you supply only the path — omit `host` for the common single-host
  toolkits (Rome fills in their default host). Supply `host` only for the hard
  cases: a toolkit with no fixed host (Supabase's `<project-ref>.supabase.co`), or
  to reach a non-default host (Dropbox content `content.dropboxapi.com`, GitHub
  uploads `uploads.github.com`). The resolved host must be the toolkit's own API
  domain (the credential is never forwarded off-provider); any other host is
  refused.

  Pass any dynamic or step-sourced QUERY value via `query` rather than
  string-building it into the path — interpolating an untrusted value into the
  query string is query-param injection; `query` is escaped for you. (For a
  dynamic PATH segment, which `query` can't carry, encodeURIComponent it before
  interpolating.) Requires being signed in (connector:connector_login) and the toolkit
  connected (connector:connector_connect) first. On a 2xx response, returns { status, data,
  headers } as `data`.

  Slack through Rome's own Slack app takes four methods: `/api/chat.postMessage`
  ({ channel, text, thread_ts? }) sends, `/api/conversations.history`
  ({ channel, limit?, latest?, oldest? }) and `/api/conversations.replies`
  ({ channel, ts, limit?, cursor? }) read, and `/api/conversations.list`
  ({ query?, limit?, cursor? }) lists the channels the app is a member of,
  reading on by passing `response_metadata.next_cursor` as `cursor`. A channel
  is named by its id or as `#name`. History answers newest first, and a page
  can hold fewer messages than `limit` with more before it: page back by
  passing the oldest `ts` as `latest` until a page comes back empty, which is
  the only one with `has_more: false`. A thread answers oldest first, from its
  start: read on by passing `response_metadata.next_cursor` as `cursor` until
  a page comes back empty. Any other Slack method is refused. With Rome's
  Slack app not connected, a Slack call fails and says to ask the guardian to
  connect it.

  With a Rome-managed Google connection, Gmail is restricted to GETs for
  /gmail/v1/users/me/profile, /messages, /messages/{id}, /threads and /threads/{id}
  (all under /gmail/v1/users/me), without custom headers/body. It never modifies,
  deletes or labels mail. Attachment downloads are not supported through this
  connection. Read replies include connectionId: send only via core:gmail_send
  with that connectionId and the profile's emailAddress as From, and every exact
  message requires the guardian's approval card. With no Rome-managed Google
  connection, Gmail calls go to the Composio Gmail connection, and sending
  through it uses its Composio Gmail tools (connector:connector_tool_execute).
  A broken grant, or a gmail_send_not_granted send, never switches to Composio:
  ask the guardian to reconnect Google. After a gmail_connection_changed send,
  read the profile again and follow what it answers. Other Google services stay on Composio.

  With a Rome-managed Microsoft connection, Outlook mail is restricted to GETs for
  /v1.0/me, /v1.0/me/messages, /v1.0/me/messages/{id}, /v1.0/me/mailFolders,
  /v1.0/me/mailFolders/{id} and /v1.0/me/mailFolders/{id}/messages, without custom
  headers/body. It never modifies, moves, deletes or flags mail, and attachments
  are not supported. Read replies include connectionId: send only via
  core:outlook_send with that connectionId and /v1.0/me's address as From, and
  every exact message requires the guardian's approval card. With no
  Rome-managed Microsoft connection, Outlook calls go to the Composio Outlook
  connection, and sending through it uses its Composio Outlook tools
  (connector:connector_tool_execute). A broken grant, or an
  outlook_send_not_granted send, never switches to Composio: ask the guardian to
  reconnect Microsoft. After an outlook_connection_changed send, read /v1.0/me
  again and follow what it answers. Calendar, contacts and other Graph paths stay on Composio.

  Fails closed: not signed in, toolkit not connected, or a non-2xx
  provider response all come back as an action error, so a rejected call never
  reads as success.

entry: ./index.ts
complexity: simple
speed: moderate
reliability: medium
sideEffects: write
