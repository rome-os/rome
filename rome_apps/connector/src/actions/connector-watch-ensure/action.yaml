name: connector_watch_ensure
type: custom
description: |
  Check, or create, the subscription that brings a watched source's events to
  Rome's event bus, for the given kinds of a target. `dryRun: true` only
  checks: it answers `active | inactive`, or fails with what stands in the way
  (GitHub needs admin rights on a repo to add its webhook; a Composio service
  such as Gmail, Google Calendar, Linear, Outlook, Notion or Stripe needs a
  connected account and a relay mailbox). Otherwise it subscribes when needed
  and answers `existing | created`. A GitHub subscription merges into Rome's
  one webhook per repo; a Composio one arms the service's triggers for the
  kinds on.
entry: ./index.ts
visibility: explicit
complexity: simple
speed: moderate
reliability: medium
sideEffects: write
