name: connector_watch_sources
type: custom
description: |
  The sources Rome can watch through this app's connections, for followers
  such as the Concierge. Each source comes with its status (ready,
  not_connected, no_relay, not_supported, error) and a reason saying what is
  missing, the connected account events are judged for (GitHub login, mailbox
  address), the target format, the kinds of event in guardian-readable words,
  and the options that tune them. Other connected apps come back as
  not_supported. Reads only; changes nothing.
entry: ./index.ts
visibility: explicit
complexity: simple
speed: moderate
reliability: medium
sideEffects: read-only
