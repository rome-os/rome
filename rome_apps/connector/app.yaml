formatVersion: 1
id: connector
name: Connector
icon: assets/icon.svg
version: 0.7.0
# NOTE: the connectable-toolkit slugs below mirror SUPPORTED_CONNECTORS in
# packages/app-runtime-sdk/src/index.ts (the source of truth for this app's UI,
# server-side gates, and connector:connector_proxy default-host map). Keep the slug list in
# sync when adding/removing a toolkit; the per-toolkit host is NOT duplicated here
# — connector:connector_proxy fills it in from the catalog's apiHost.
description: |
  Connect and orchestrate third-party APIs (Gmail, Calendar, Slack, Supabase, Neon, and more) via Composio. Once a toolkit is connected, call its native provider REST/GraphQL API with the `connector:connector_proxy` action: pass the toolkit slug, a relative `path` (e.g. `/gmail/v1/users/me/messages`), and the method — Connector prepends the toolkit's API host and injects the connection's credential, so you handle neither the host nor the token. `connector:connector_proxy` requires being signed in (`connector:connector_login`) and the toolkit connected (`connector:connector_connect`) first, and fails closed (not-signed-in, not-connected, or a non-2xx provider response all return an action error). Connectable toolkits (slug): Gmail (`gmail`), Outlook (`outlook`), Calendar (`googlecalendar`), GitHub (`github`), Slack (`slack`), Notion (`notion`), Drive (`googledrive`), Sheets (`googlesheets`), Docs (`googledocs`), Slides (`googleslides`), Google Ads (`googleads`), Dropbox (`dropbox`), Linear (`linear`), Discord (`discord`), LinkedIn (`linkedin`), Meta Ads (`metaads`), Supabase (`supabase`), Neon (`neon`), HubSpot (`hubspot`), Stripe (`stripe`), Freshdesk (`freshdesk`), Shopify (`shopify`), Otter.ai (`otter_ai_mcp`). This is the set of toolkits that are connectable — not which are currently connected. If you need one that isn't connected yet, ask the guardian to connect it. Connection status is not known here, so if a call comes back as not-connected, ask the guardian to connect it again. Rome fills in each toolkit's API host, so pass only `path` and omit `host` — except where there is no deterministic host: supply `host` for Supabase (the per-project `<project-ref>.supabase.co`) and Freshdesk (the account's `<domain>.freshdesk.com`), or to reach a provider's non-default host (Dropbox content `content.dropboxapi.com`, GitHub uploads `uploads.github.com`). Rome doesn't know a Freshdesk account's domain, so prefer its Composio tools (`connector:connector_search`, then `connector:connector_tool_execute`), which call the connected account's domain themselves. Proxy Freshdesk only for an endpoint those tools don't cover, and ask the guardian for the domain once rather than guessing it. Otter.ai has no REST API to proxy: find its tools with `connector:connector_search` and run them with `connector:connector_tool_execute`.

  For GitHub, prefer the `gh` CLI and `git` directly in the shell (`gh api`, `gh pr`, `git clone/push`) — it's Rome-managed (no Composio). If a `gh`/`git` call reports it is not authenticated, call the `connect_service` tool with kind `github`. To react to GitHub events (push, PRs, issues), use `connector:connector_github_subscribe` (NOT `connector:connector_event_subscribe`, which is Composio-only) — it registers Rome's own webhook on the repo/org and returns the event-bus topic a routine binds to. To stop receiving them, use `connector:connector_github_unsubscribe` with the same repo/org.

  Slack is also Rome-managed (no Composio): act on it with `connector:connector_proxy` (toolkit `slack`). Through Rome's own Slack app it takes `/api/chat.postMessage`, `/api/conversations.history`, `/api/conversations.replies` and `/api/conversations.list`, and refuses any other method; `connector:connector_proxy`'s description gives each one's arguments. Do NOT use `connector:connector_login`/`connector:connector_connect`/`connector:connector_tool_execute` for Slack. The guardian connects Slack in Settings → Connections, not from the chat: if a Slack call comes back not connected, ask the guardian, in a message, to connect it there.

  Gmail runs through one of two connections, and the route to send follows the one in use. Read Gmail with `connector:connector_proxy`, toolkit `gmail`: it reads through a Rome-managed Google connection when there is one, and through the Composio Gmail connection otherwise. Through the Rome-managed connection, reads are GETs of `/gmail/v1/users/me/profile`, `/gmail/v1/users/me/messages`, `/gmail/v1/users/me/messages/{id}`, `/gmail/v1/users/me/threads` or `/gmail/v1/users/me/threads/{id}`, never modify, delete or label mail, and each reply carries `connectionId`. (1) If a Gmail read reply carries `connectionId`, Gmail is Rome-managed: send only with `core:gmail_send`, never with a Composio tool or a raw proxy call. First read the profile for its emailAddress (the From) and connectionId. The guardian approves each exact From/To/Subject/Body on an approval card, even on a schedule. (2) If the reply has no `connectionId`, or `core:gmail_read` answers `gmail_not_connected`, Gmail is the Composio Gmail connection: send with its Gmail tools through `connector:connector_tool_execute`, as for any Composio toolkit. Sending through it works, so never tell the guardian that Rome cannot send through Composio. (3) If the Rome-managed connection is broken, or a send answers `gmail_send_not_granted`, never switch to Composio or another mailbox: ask the guardian to reconnect Google in Settings → Connections. If a send answers `gmail_connection_changed`, read the profile again for the current connectionId, and never switch to Composio. Suggest connecting Google only when Rome offers it as a kind to connect: `connect_service` takes kind `google`, or `core:concierge_following_list` lists a `google` service. Where neither does, this Rome does not offer a Google connection, so stay on Composio. Gmail event triggers use Composio.

  Outlook mail runs through one of two connections, the same way as Gmail. Read mail with `connector:connector_proxy`, toolkit `outlook`: it reads through a Rome-managed Microsoft connection when there is one, and through the Composio Outlook connection otherwise. Through the Rome-managed connection, mail reads are GETs of `/v1.0/me`, `/v1.0/me/messages`, `/v1.0/me/messages/{id}`, `/v1.0/me/mailFolders`, `/v1.0/me/mailFolders/{id}` or `/v1.0/me/mailFolders/{id}/messages`, never modify, move, delete or flag mail, and each reply carries `connectionId`. (1) If an Outlook mail read reply carries `connectionId`, Outlook mail is Rome-managed: send only with `core:outlook_send`, never with a Composio tool or a raw proxy call. First read `/v1.0/me` for the sender address (`mail`, else `userPrincipalName`) and connectionId. The guardian approves each exact From/To/Subject/Body on an approval card, even on a schedule. A send is a new message, not a threaded reply. (2) If the reply has no `connectionId`, or `core:outlook_read` answers `outlook_not_connected`, Outlook is the Composio Outlook connection: send with its Outlook tools through `connector:connector_tool_execute`, as for any Composio toolkit. Sending through it works, so never tell the guardian that Rome cannot send through Composio. (3) If the Rome-managed connection is broken, or a send answers `outlook_send_not_granted`, never switch to Composio or another mailbox: ask the guardian to reconnect Microsoft in Settings → Connections. If a send answers `outlook_connection_changed`, read `/v1.0/me` again for the current connectionId, and never switch to Composio. Suggest connecting Microsoft only when Rome offers it as a kind to connect: `connect_service` takes kind `microsoft`, or `core:concierge_following_list` lists a `microsoft` service. Where neither does, this Rome does not offer a Microsoft connection, so stay on Composio. Calendar, contacts and other Graph calls stay on the Composio Outlook connection, as do Outlook event triggers.

  Shopify is also Rome-managed (no Composio): act on it with `connector:connector_proxy` (toolkit `shopify`) against the store's GraphQL Admin API, POST `/admin/api/2026-10/graphql.json` with a `{ query, variables }` body. That endpoint is the only one allowed: a REST Admin API path or a method other than POST is refused. Omit `host`: Rome sends the call to the connected store's `<store>.myshopify.com`. Rome OS can read and update products and inventory and read orders; anything else returns an access error. Do NOT use `connector:connector_login`/`connector:connector_connect`/`connector:connector_tool_execute` for Shopify. To connect it, call the `connect_service` tool with kind `shopify`: the card it shows opens Shopify, where the guardian picks the store and approves Rome OS. Never ask the guardian for the store's address. If a Shopify call comes back not-connected, do the same.
tagline: "Give your agent Gmail, Slack, GitHub, Notion, and 19 more, in one click."
hideInLauncher: true
appRoot: dist

web:
  manifest: web/manifest.json
  displayName: Connector
  navLabel: Connector

api:
  entry: api/index
  noAuth:
    - /webhook
  # Relay consumer: core drains the webhook relay mailbox and replays each
  # deposited webhook into this app's POST /webhook handler.
  relayWebhook: /webhook

db:
  migrations: db/migrations

# Inline components this app registers (via defineComponent) and may render into
# the chat transcript. Core validates an action's renderComponent.componentId
# against this list before mounting.
components:
  - connect-card
  - login-card

actions:
  - actions/connector-login
  - actions/connector-connect
  - actions/connector-search
  - actions/connector-tool-schema
  - actions/connector-tool-execute
  - actions/connector-proxy
  - actions/connector-event-search
  - actions/connector-event-schema
  - actions/connector-event-subscribe
  - actions/connector-github-subscribe
  - actions/connector-github-unsubscribe
  - actions/connector-event-ensure
  - actions/connector-watch-sources
  - actions/connector-watch-ensure
  - actions/connector-watch-normalize
  - actions/connector-watch-release

# What this app's connections let Rome watch. Core discovers watch providers
# from this declaration and never names the app; the Concierge's following
# reads the connectors, kinds and options through `sources`.
watchProvider:
  sources: connector_watch_sources
  ensure: connector_watch_ensure
  normalize: connector_watch_normalize
  release: connector_watch_release

# Events this app delivers on the bus. A `defer` on one of them calls
# `ensureAction` to subscribe first, and `system:search_event_catalog` lists `types`
# before they are first emitted. `keys`: filter fields that pick the repo or org.
eventSources:
  - events: "provider:event:github.*"
    keys: [["repository.full_name"], ["organization.login"]]
    types:
      - push
      - pull_request
      - pull_request_review
      - pull_request_review_comment
      - issues
      - issue_comment
      - workflow_run
      - workflow_job
      - check_suite
      - check_run
      - status
      - release
      - create
      - delete
      - deployment_status
    ensureAction: connector_event_ensure
  # New mail in the connected Gmail inbox, through Composio's polling trigger.
  # It follows the connected account, so a wait names no key. Only this one
  # event: other Gmail triggers stay undeclared, so `defer` sets their waits
  # with a warning, as before.
  - events: "provider:event:gmail.gmail_new_gmail_message"
    ensureAction: connector_event_ensure
  # The connected Google Calendar's primary calendar, through Composio's polling
  # triggers: a meeting about to start, an event created, changed or deleted
  # (with its attendees), and an attendee's reply. Like Gmail's, these and the
  # Composio events below follow the connected account and name no key, and
  # each service's other triggers stay undeclared.
  - events: "provider:event:googlecalendar.googlecalendar_event_starting_soon_trigger"
    ensureAction: connector_event_ensure
  - events: "provider:event:googlecalendar.googlecalendar_google_calendar_event_sync_trigger"
    ensureAction: connector_event_ensure
  - events: "provider:event:googlecalendar.googlecalendar_attendee_response_changed_trigger"
    ensureAction: connector_event_ensure
  # Linear's public-team webhooks, workspace-wide: a new issue, a changed
  # issue, a new comment.
  - events: "provider:event:linear.linear_public_team_issue_created"
    ensureAction: connector_event_ensure
  - events: "provider:event:linear.linear_public_team_issue_properties_updated"
    ensureAction: connector_event_ensure
  - events: "provider:event:linear.linear_public_team_comment_created"
    ensureAction: connector_event_ensure
  # New mail in the connected Outlook inbox.
  - events: "provider:event:outlook.outlook_message_trigger"
    ensureAction: connector_event_ensure
  # Notion's workspace webhooks: a new comment, a page's content or properties
  # changed, a new page.
  - events: "provider:event:notion.notion_comment_created"
    ensureAction: connector_event_ensure
  - events: "provider:event:notion.notion_page_content_updated"
    ensureAction: connector_event_ensure
  - events: "provider:event:notion.notion_page_properties_updated"
    ensureAction: connector_event_ensure
  - events: "provider:event:notion.notion_page_created"
    ensureAction: connector_event_ensure
  # The connected Stripe account: failed payments and payouts, disputes,
  # refunds, canceled subscriptions, and successful charges.
  - events: "provider:event:stripe.stripe_charge_failed"
    ensureAction: connector_event_ensure
  - events: "provider:event:stripe.stripe_invoice_payment_failed"
    ensureAction: connector_event_ensure
  - events: "provider:event:stripe.stripe_charge_dispute_created"
    ensureAction: connector_event_ensure
  - events: "provider:event:stripe.stripe_charge_dispute_closed"
    ensureAction: connector_event_ensure
  - events: "provider:event:stripe.stripe_charge_refunded"
    ensureAction: connector_event_ensure
  - events: "provider:event:stripe.stripe_customer_subscription_deleted"
    ensureAction: connector_event_ensure
  - events: "provider:event:stripe.stripe_payout_failed"
    ensureAction: connector_event_ensure
  - events: "provider:event:stripe.stripe_charge_succeeded"
    ensureAction: connector_event_ensure

skills:
  - skills/composio-cli
