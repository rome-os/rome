formatVersion: 1
id: connector
name: Connector
icon: assets/icon.svg
version: 0.7.0
# NOTE: the connectable-toolkit slugs below mirror SUPPORTED_CONNECTORS in
# packages/app-runtime-sdk/src/index.ts (the source of truth for this app's UI,
# server-side gates, and connector_proxy default-host map). Keep the slug list in
# sync when adding/removing a toolkit; the per-toolkit host is NOT duplicated here
# — connector_proxy fills it in from the catalog's apiHost.
description: |
  Connect and orchestrate third-party APIs (Gmail, Calendar, Slack, Supabase, Neon, and more) via Composio. Once a toolkit is connected, call its native provider REST/GraphQL API with the `connector_proxy` action: pass the toolkit slug, a relative `path` (e.g. `/gmail/v1/users/me/messages`), and the method — Connector prepends the toolkit's API host and injects the connection's credential, so you handle neither the host nor the token. `connector_proxy` requires being signed in (`connector_login`) and the toolkit connected (`connector_connect`) first, and fails closed (not-signed-in, not-connected, or a non-2xx provider response all return an action error). Connectable toolkits (slug): Gmail (`gmail`), Outlook (`outlook`), Calendar (`googlecalendar`), GitHub (`github`), Slack (`slack`), Notion (`notion`), Drive (`googledrive`), Sheets (`googlesheets`), Docs (`googledocs`), Slides (`googleslides`), Google Ads (`googleads`), Dropbox (`dropbox`), Linear (`linear`), Discord (`discord`), LinkedIn (`linkedin`), Meta Ads (`metaads`), Supabase (`supabase`), Neon (`neon`), HubSpot (`hubspot`), Stripe (`stripe`). This is the set of toolkits that are connectable — not which are currently connected. If you need one that isn't connected yet, ask the guardian to connect it. Connection status is not known here, so if a call comes back as not-connected, ask the guardian to connect it again. Rome fills in each toolkit's API host, so pass only `path` and omit `host` — except where there is no deterministic host: supply `host` for Supabase (the per-project `<project-ref>.supabase.co`), or to reach a provider's non-default host (Dropbox content `content.dropboxapi.com`, GitHub uploads `uploads.github.com`).

  For GitHub, prefer the `gh` CLI and `git` directly in the shell (`gh api`, `gh pr`, `git clone/push`) — it's Rome-managed (no Composio). If a `gh`/`git` call reports it is not authenticated, ask the guardian to connect GitHub at `/settings`. To react to GitHub events (push, PRs, issues), use `connector_github_subscribe` (NOT `connector_event_subscribe`, which is Composio-only) — it registers Rome's own webhook on the repo/org and returns the event-bus topic a routine binds to. To stop receiving them, use `connector_github_unsubscribe` with the same repo/org.

  Slack is also Rome-managed (no Composio): act on it with `connector_proxy` (toolkit `slack`) against the Slack Web API — e.g. POST `/api/chat.postMessage`, `/api/conversations.list`, `/api/search.messages`. Do NOT use `connector_login`/`connector_connect`/`connector_tool_execute` for Slack. If a Slack call comes back not-connected, ask the guardian to connect Slack at `/settings`.
tagline: "Give your agent Gmail, Slack, GitHub, Notion, and 15 more, in one click."
appRoot: dist

web:
  manifest: web/manifest.json
  displayName: Connector
  navLabel: Connector

api:
  entry: api/index
  noAuth:
    - /webhook
  # Relay consumer: core drains the webhook relay mailbox and replays each
  # deposited webhook into this app's POST /webhook handler.
  relayWebhook: /webhook

db:
  migrations: db/migrations

# Inline components this app registers (via defineComponent) and may render into
# the chat transcript. Core validates an action's renderComponent.componentId
# against this list before mounting.
components:
  - connect-card
  - login-card

actions:
  - actions/connector-login
  - actions/connector-connect
  - actions/connector-search
  - actions/connector-tool-schema
  - actions/connector-tool-execute
  - actions/connector-proxy
  - actions/connector-event-search
  - actions/connector-event-schema
  - actions/connector-event-subscribe
  - actions/connector-github-subscribe
  - actions/connector-github-unsubscribe

skills:
  - skills/composio-cli
