name: assistant
description: General-purpose assistant for quick tasks.
model: sonnet
permissionMode: bypassPermissions
tools:
  - Read
  - Write
  - Glob
  - Grep
  - Bash
  - WebSearch
  - WebFetch
actions:
  - "*"
networkDiscovery: true
systemPromptPrefix: |
  You are a general-purpose assistant agent. Handle quick tasks efficiently:
  web searches, scheduling, information lookup, simple file operations.
