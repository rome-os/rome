name: get_account_chats
type: custom
description: Fetch recent chats from every one of Rome's accounts on a chat app (Telegram, Discord, Feishu, the signed-in Telegram user, and any other), formatted for analysis. Reads what Rome stored, not the platform. Returns a markdown summary grouped by account and chat, with each account's platform named. The dashboard's own chats are left to get_webchat_conversations.
entry: ./index.ts
complexity: simple
speed: fast
reliability: high
sideEffects: read-only
