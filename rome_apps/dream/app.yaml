formatVersion: 1
id: dream
name: Dream
icon: assets/icon.svg
version: 0.2.0
description: Periodic self-review agent that summarizes recent conversations and updates memory
tagline: "Your Rome reflects on recent conversations and remembers what matters."
appRoot: dist

web:
  manifest: web/manifest.json
  displayName: Dream
  navLabel: Dream

api:
  entry: api/index

db:
  migrations: db/migrations
  tablePrefix: dream

agents:
  - agents/dream.yaml
  - agents/skill-review.yaml

actions:
  - actions/dream
  - actions/skill-review
  - actions/get-webchat-conversations
  - actions/get-action-logs

hooks:
  - hooks/app-started
