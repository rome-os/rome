formatVersion: 1
id: system
name: System
icon: assets/icon.svg
version: 0.2.21
description: "Core system actions for scheduling, messaging, approvals, app store access, and subagent orchestration. In Rome context, 'store' / 'app store' usually means the Rome App Store. Core's own tools cover the Apps page: system:read_apps, system:search_app_store (search/read Rome Store listings), system:manage_app (install from the Rome Store, update, turn on or off, or remove an app), system:publish_app and system:share_app. Reach here for system:app_management (install a dev app from its source or scaffold a new one), system:send_message (send a message through any registered channel adapter), system:send_user_message (start or continue a webchat conversation with a source badge when speaking for the guardian, otherwise as automation), and system:generate_image (generate an image from a text prompt via the connected image provider)."
tagline: "The control room: scheduling, messaging, approvals, and the app store."
hideInLauncher: true
appRoot: dist

web:
  manifest: web/manifest.json
  displayName: System
  navLabel: System

api:
  entry: api/index

hooks:
  - hooks/agent-turn-finished

agents:
  - agents/image-gen.yaml

skills:
  - skills/app-lifecycle
  - skills/custom-dependencies

actions:
  - actions/app-management
  - actions/app-store-search
  - actions/create-routine
  - actions/delete-routine
  - actions/conversation-settings-manage
  - actions/email-inbound
  - actions/execute-root-script
  - actions/fetch-channel-history
  - actions/generate-image
  - actions/get-guardian-cloud-profile
  - actions/manage-root-script
  - actions/publish-event
  - actions/search-event-catalog
  - actions/search-routine
  - actions/request-approval-demo
  - actions/resume-session
  - actions/send-message
  - actions/send-feedback
  - actions/send-notification
  - actions/send-user-message
  - actions/show-app
  - actions/summon
  - actions/system-upgrade
  - actions/vault-apply
  - actions/vault-search
