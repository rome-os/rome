name: send_user_message
type: system
description: Send a webchat message on the guardian's behalf — the message appears in the web dashboard as if the guardian typed it, and the receiving agent runs a turn and replies in that chat. By default this starts a new chat with the main agent, named after the message; pass sessionId to continue an existing webchat conversation instead (its locked agent replies), agentName to start the chat with a different agent, or sessionName/projectPath to shape the new chat. Fire-and-forget — it returns the sessionId/turnId immediately and the reply is delivered to the chat, not returned here. Use it as a routine's action for scheduled prompts (e.g. a morning briefing the guardian reads in webchat) or to open a conversation with another agent for the guardian. Pass guardian-only sessionMetadata when creating a chat to mark it isolated (no memory/project prompt context or dream self-review), record its purpose, and identify its creating app. Metadata cannot be changed on an existing session. Isolation is not a filesystem sandbox. Never target the webchat session you are currently answering in.
complexity: simple
speed: fast
reliability: high
sideEffects: write
