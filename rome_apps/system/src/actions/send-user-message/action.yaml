name: send_user_message
type: system
description: Send an automated webchat message — a main-agent, Concierge, or app source with a guardian chain actor speaks for the guardian, with the source named below the bubble; other sends show the source on the left with an Automated label, and the receiving agent runs a turn and replies in that chat. By default this starts a new chat with the main agent, named after the message; pass sessionId to continue an existing webchat conversation instead (its locked agent replies), agentName to start the chat with a different agent, or sessionName/projectPath to shape the new chat. Fire-and-forget — it returns the sessionId/turnId immediately and the reply is delivered to the chat, not returned here. Use it as a routine's action for scheduled prompts (e.g. a morning briefing the guardian reads in webchat) or to open a conversation with another agent for the guardian. Never target the webchat session you are currently answering in.
complexity: simple
speed: fast
reliability: high
sideEffects: write
