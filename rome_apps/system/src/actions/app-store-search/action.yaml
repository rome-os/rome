name: app_store_search
type: system
description: "Use system:search_app_store instead: it finds apps in the Rome App Store and reads one listing. This older action keeps working for saved routines. It searches or inspects the Rome App Store (also called \"store\", \"app store\", \"Rome store\", or marketplace), read-only. It is Rome's own App Store, not Apple App Store / Google Play unless the guardian explicitly says those."
complexity: simple
speed: fast
reliability: medium
sideEffects: read-only
