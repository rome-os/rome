name: stop_routine
type: system
description: Stop a routine's running run, as the Routines page's Stop does — each running run ends as cancelled. A run waiting for the guardian's approval is not stopped. The routine itself stays on; pause it with system:pause_routine to stop future runs. Only in the guardian's private chat, in a turn their own message started, so a routine cannot use it as its action
complexity: simple
speed: fast
reliability: high
sideEffects: write
