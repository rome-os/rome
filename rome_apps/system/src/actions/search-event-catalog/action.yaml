name: search_event_catalog
type: system
description: Search the event types an event-bus routine or an event `defer` can wait on. Pass keywords describing the event ("gmail new email", "github workflow run", "pull request") and a limit; returns the best-matching event types plus a total match count. Each result can carry a payloadSchema (JSON Schema for the payload; schemaOrigin "observed" means it was inferred from a recent emission and is a guide, not a contract) so you can write a filter against real fields. `subscribable` types come from an app that subscribes at the provider when you wait on them; their `keys` list the filter fields that pick where to subscribe, and a wait must filter on every field of one inner list (e.g. repository.full_name). Pass `match` (e.g. {"repository.full_name":"acme/widgets"}) to see whether each subscribable type is already `active` there. Types that are not subscribable appear only after they were first emitted, and payloadSchema is absent until a type was emitted with a non-empty payload.
complexity: simple
speed: fast
reliability: high
sideEffects: read-only
