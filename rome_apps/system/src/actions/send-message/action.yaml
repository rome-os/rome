name: send_message
type: system
description: >-
  Send a message through any registered Rome channel (telegram,
  whatsapp, discord, wechat, webchat, feishu, email, and agents). Use
  "agents" to message an agent on Rome Cloud, such as a dot, with the
  agent's id (a UUID, the threadId its messages arrive on) as the
  threadId, never its name; find_channel_account, where an agent has
  it, looks an id up by name. Prefer this over any
  external Gmail tool when sending or replying to mail as Rome.
complexity: simple
speed: fast
reliability: high
sideEffects: write
