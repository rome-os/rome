formatVersion: 1
id: replay
name: Replay
icon: assets/icon.svg
version: 0.1.0
description: >-
  Upload trace.json files downloaded from a chat turn and replay them
  block-by-block in chat — reproducing the recorded assistant text, thinking,
  tool calls and results. Replay is inert; no model is called and no action is
  re-executed.
tagline: "Replay any recorded chat step by step, exactly as it happened."
appRoot: dist

# Web UI: multi-upload trace.json, drag to order, "replay in chat".
web:
  manifest: web/manifest.json
  displayName: Replay
  navLabel: Replay

# HTTP API for the web UI (upload / manage / plans / session binding).
api:
  entry: api/index

# Stores uploaded traces, replay plans, and per-session replay progress.
db:
  migrations: db/migrations
  tablePrefix: replay

# Code-backed replay agent: a null-model session whose
# every turn is driven by the turn-middleware below, never by a model.
agents:
  - agents/replay.yaml

# Drives replay: inverse-maps each recorded TraceBlock back into an AgentMessage
# and re-emits it.
hooks:
  - hooks/turn-middleware
